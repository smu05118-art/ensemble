<script>
'use strict';
const D=JSON.parse(document.getElementById('rack-data').textContent), ORDER=D.order;
const state={co:'DELL',cat:'전체'}; const COLORS=['#2f7fe0','#7557d8','#0f9d76','#c98a12','#d84557','#3aa9ad'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=1)=>v==null?'—':(typeof v==='number'?v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}):esc(v));
const pct=(v,d=1)=>v==null?'—':`${v>0?'+':''}${v.toFixed(d)}%`;
const yoy=(rows,i)=>i>=4&&rows[i-4].rev?((rows[i].rev/rows[i-4].rev)-1)*100:null;
function tag(text,kind=''){return `<span class="tag ${kind}">${esc(text)}</span>`}
function lineChart(labels,series,H=230){
  const W=980,L=52,R=18,T=18,B=35,all=series.flatMap(s=>s.data.filter(v=>typeof v==='number')),max=Math.max(...all,1),min=Math.min(0,...all),n=labels.length;
  const x=i=>L+(W-L-R)*(n===1?.5:i/(n-1)), y=v=>T+(max-v)/(max-min||1)*(H-T-B);
  let z=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="시계열 차트">`;
  for(let i=0;i<4;i++){const yy=T+(H-T-B)*i/3,val=max-(max-min)*i/3;z+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--line)"/><text x="${L-6}" y="${yy+3}" text-anchor="end" font-size="8" fill="var(--dim)">${val.toFixed(1)}</text>`}
  series.forEach((s,si)=>{let p='';s.data.forEach((v,i)=>{if(v==null)return;p+=(p?'L':'M')+x(i)+','+y(v)});z+=`<path d="${p}" fill="none" stroke="${s.color||COLORS[si]}" stroke-width="2"/>`;s.data.forEach((v,i)=>{if(v==null)return;z+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.7" fill="${s.color||COLORS[si]}"><title>${esc(labels[i])} · ${esc(s.label)} ${v}</title></circle>`})});
  const step=Math.max(1,Math.ceil(n/8));labels.forEach((v,i)=>{if(i%step&&i!==n-1)return;z+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="8" fill="var(--dim)">${esc(v)}</text>`});return z+'</svg>';
}
function combo(labels,bars,line,H=230){
  const W=980,L=50,R=50,T=18,B=34,n=labels.length,mx=Math.max(...bars,1),lm=Math.max(...line.filter(v=>v!=null),1),ln=Math.min(0,...line.filter(v=>v!=null));
  const x=i=>L+(W-L-R)*(i+.5)/n,bw=Math.max(7,(W-L-R)/n*.56),yb=v=>T+(mx-v)/mx*(H-T-B),yl=v=>T+(lm-v)/(lm-ln||1)*(H-T-B);
  let z=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="매출 및 영업이익률 차트">`;
  for(let i=0;i<4;i++){const yy=T+(H-T-B)*i/3;z+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--line)"/><text x="${L-5}" y="${yy+3}" text-anchor="end" font-size="8" fill="var(--dim)">${(mx*(1-i/3)).toFixed(1)}</text>`}
  bars.forEach((v,i)=>z+=`<rect x="${x(i)-bw/2}" y="${yb(v)}" width="${bw}" height="${H-B-yb(v)}" rx="2" fill="var(--accSoft)"><title>${esc(labels[i])} 매출 ${v}</title></rect>`);
  let p='';line.forEach((v,i)=>{if(v==null)return;p+=(p?'L':'M')+x(i)+','+yl(v)});z+=`<path d="${p}" fill="none" stroke="var(--acc)" stroke-width="2"/>`;line.forEach((v,i)=>{if(v==null)return;z+=`<circle cx="${x(i)}" cy="${yl(v)}" r="2.8" fill="var(--acc)"><title>${esc(labels[i])} OPM ${v.toFixed(1)}%</title></circle>`});
  labels.forEach((v,i)=>{if(n>9&&i%2&&i!==n-1)return;z+=`<text x="${x(i)}" y="${H-9}" text-anchor="middle" font-size="8" fill="var(--dim)">${esc(v)}</text>`});z+=`<text x="${W-R+6}" y="${T+4}" font-size="8" fill="var(--acc)">OPM ${lm.toFixed(0)}%</text>`;return z+'</svg>';
}
function filtered(){return ORDER.filter(k=>state.cat==='전체'||D.companies[k].category===state.cat)}
function drawControls(){const cats=['전체','브랜드 OEM','EMS/HPS','ODM','부품'];document.getElementById('cats').innerHTML=cats.map(c=>`<span class="chip ${c===state.cat?'on':''}" data-cat="${c}">${c}</span>`).join('');document.querySelectorAll('[data-cat]').forEach(e=>e.onclick=()=>{state.cat=e.dataset.cat;if(!filtered().includes(state.co))state.co=filtered()[0];render()});document.getElementById('chips').innerHTML=filtered().map(k=>`<span class="chip ${k===state.co?'on':''}" data-co="${k}">${esc(D.companies[k].label)}</span>`).join('');document.querySelectorAll('[data-co]').forEach(e=>e.onclick=()=>{state.co=e.dataset.co;render()})}
function financialReview(c){const r=c.financial_refresh_review;if(!r)return '';return '<section class="panel callout" data-financial-review="'+esc(r.status)+'"><h2>공식 재무 연결 · '+esc(r.active_financials?'선택 분기 검증':'현재 검증 보류')+'</h2><p class="note">'+esc(r.message)+'</p><div class="note">'+esc((r.basis||'')+' · '+(r.period||'이전 연구 빈티지'))+'</div></section>';}
function financialInterpretationHeld(c){return c.financial_refresh_review?.dependent_interpretation==='review_required';}
function overview(){let h='<thead><tr><th>레이어</th><th>기업</th><th>최신</th><th class="num">매출</th><th class="num">영업이익</th><th class="num">OPM</th><th class="num">매출 YoY</th><th>백로그</th><th>BM-프록시</th></tr></thead><tbody>';filtered().forEach(k=>{const c=D.companies[k],r=c.fin_q,i=r.length-1,v=r[i],yy=yoy(r,i),opm=v.rev?v.op/v.rev*100:null;h+=`<tr class="pick ${k===state.co?'sel':''}" data-row="${k}"><td>${tag(c.category)}</td><td><b>${esc(c.label)}</b><br><span class="stamp">${esc(c.ticker)} · ${esc(c.ccy)}</span></td><td class="stamp">${esc(v.fiscal_label)}</td><td class="num">${fmt(v.rev,3)}</td><td class="num ${v.op>0?'pos':'neg'}">${fmt(v.op,3)}</td><td class="num">${pct(opm)}</td><td class="num ${yy>0?'pos':yy<0?'neg':''}">${pct(yy)}</td><td>${c.backlog_status==='NOT FOUND'?tag('NOT FOUND','nf'):tag(c.backlog_status,'actual')}</td><td>${tag(financialInterpretationHeld(c)?'검토 필요':c.bm_grade)}</td></tr>`});document.getElementById('overview').innerHTML=h+'</tbody>';document.querySelectorAll('[data-row]').forEach(e=>e.onclick=()=>{state.co=e.dataset.row;render()})}
function detail(){const c=D.companies[state.co],r=c.fin_q,i=r.length-1,v=r[i],yy=yoy(r,i),opm=v.rev?v.op/v.rev*100:null,prev=i?((v.rev/r[i-1].rev)-1)*100:null;
  let h=financialReview(c)+`<div class="stat"><div class="box"><div class="k">${esc(v.fiscal_label)} 매출 · ${esc(c.ccy)}</div><div class="v">${fmt(v.rev,3)}</div><div class="s">YoY <b class="${yy>0?'pos':'neg'}">${pct(yy)}</b> · QoQ ${pct(prev)}</div></div><div class="box"><div class="k">영업이익</div><div class="v ${v.op>0?'pos':'neg'}">${fmt(v.op,3)}</div><div class="s">${esc(c.financial_refresh_review?.active_financials===false?'이전 연구 빈티지':v.status)} · 통화 미환산</div></div><div class="box"><div class="k">OPM</div><div class="v">${pct(opm).replace('+','')}</div><div class="s">GAAP/회사 공시 영업이익</div></div><div class="box"><div class="k">레이어 · BM 적합</div><div class="v" style="font-size:15px">${esc(c.category)} · ${esc(financialInterpretationHeld(c)?'검토 필요':c.bm_grade)}</div><div class="s">투자등급 아님</div></div></div>`;
  h+=`<section class="panel callout"><h2>${esc(c.label)} — ${financialInterpretationHeld(c)?'이전 연구 · 현재 판정 검토 필요':'체인 판독'}</h2><div style="font-size:11.8px;line-height:1.75;margin-top:6px">${esc(c.bm)}</div><div class="note" style="margin-top:7px"><b>최신 근거.</b> ${esc(c.latest_basis)} · <b>백로그.</b> ${esc(c.backlog_note)}</div></section>`;
  const labs=r.map(x=>x.fiscal_label),opms=r.map(x=>x.rev?x.op/x.rev*100:null);h+=`<section class="panel"><h2>분기 재무</h2><div class="cap">막대=매출(좌, ${esc(c.ccy)}) · 선=OPM%(우) · 전부 실적, est 없음</div>${combo(labs,r.map(x=>x.rev),opms)}<div class="scroll"><table><thead><tr><th>회계분기</th><th>분기말</th><th class="num">매출</th><th class="num">영업이익</th><th class="num">OPM</th><th class="num">YoY</th><th>구분</th></tr></thead><tbody>${r.map((x,j)=>`<tr><td class="stamp">${esc(x.fiscal_label)}</td><td class="stamp">${esc(x.period_end)}</td><td class="num">${fmt(x.rev,3)}</td><td class="num">${fmt(x.op,3)}</td><td class="num">${pct(x.rev?x.op/x.rev*100:null).replace('+','')}</td><td class="num">${pct(yoy(r,j))}</td><td>${c.financial_refresh_review?.active_financials===false?tag('이전 연구 빈티지'):tag('실적','actual')}</td></tr>`).join('')}</tbody></table></div><div class="note">${esc(v.basis)}</div></section>`;
  h+=`<div class="grid2"><section class="panel scroll"><h2>${financialInterpretationHeld(c)?'이전 연구 · ':''}제품·세그먼트</h2><div class="cap">같은 계층만 합산 · 하위지표는 basis에 명시</div><table><thead><tr><th>항목</th><th>기간</th><th class="num">값</th><th>근거</th></tr></thead><tbody>${c.segments.map(s=>`<tr><td>${esc(s.name)}</td><td class="stamp">${esc(s.period)}</td><td class="num">${s.value==null?tag('NOT FOUND','nf'):fmt(s.value,typeof s.value==='number'?3:0)}</td><td>${s.basis.includes('NOT FOUND')?tag(s.basis,'nf'):tag(s.basis,s.basis.includes('파생')?'est':'actual')}</td></tr>`).join('')}</tbody></table><div class="note">${esc(c.segment_note)}</div></section>`;
  h+=`<section class="panel scroll"><h2>${financialInterpretationHeld(c)?'이전 공시 빈티지 · ':''}가이던스</h2><div class="cap">원/수정·실적 분리 · 미래값은 est:true+reason</div><table><thead><tr><th>공시</th><th>항목</th><th>값</th><th>상태</th><th>reason</th></tr></thead><tbody>${c.guidance.map(g=>`<tr><td class="stamp">${esc(g.when)}</td><td>${esc(g.item)}</td><td>${esc(g.value)}</td><td>${g.status==='미공시'?tag(g.status,'nf'):tag(g.status,'est')}</td><td class="wide note">${esc(g.reason)}</td></tr>`).join('')}</tbody></table></section></div>`;
  h+=backlogPanel(state.co,c);
  h+=`<section class="panel"><h2>캐파·증설 로드맵</h2><div style="font-size:11.5px;line-height:1.75;margin-top:6px">${esc(c.capa)}</div></section>`;
