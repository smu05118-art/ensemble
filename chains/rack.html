<script>

const fmt=(v,d=1)=>v==null?'—':(typeof v==='number'?v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}):esc(v));

function tag(text,kind=''){return `<span class="tag ${kind}">${esc(text)}</span>`}
function lineChart(labels,series,H=230){
  const W=980,L=52,R=18,T=18,B=35,all=series.flatMap(s=>s.data.filter(v=>typeof v==='number')),max=Math.max(...all,1),min=Math.min(0,...all),n=labels.length;
  const x=i=>L+(W-L-R)*(n===1?.5:i/(n-1)), y=v=>T+(max-v)/(max-min||1)*(H-T-B);
  let z=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="시계열 차트">`;
  for(let i=0;i<4;i++){const yy=T+(H-T-B)*i/3,val=max-(max-min)*i/3;z+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--line)"/><text x="${L-6}" y="${yy+3}" text-anchor="end" font-size="8" fill="var(--dim)">${val.toFixed(1)}</text>`}
  series.forEach((s,si)=>{let p='';s.data.forEach((v,i)=>{if(v==null)return;p+=(p?'L':'M')+x(i)+','+y(v)});z+=`<path d="${p}" fill="none" stroke="${s.color||COLORS[si]}" stroke-width="2"/>`;s.data.forEach((v,i)=>{if(v==null)return;z+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.7" fill="${s.color||COLORS[si]}"><title>${esc(labels[i])} · ${esc(s.label)} ${v}</title></circle>`})});
  const step=Math.max(1,Math.ceil(n/8));labels.forEach((v,i)=>{if(i%step&&i!==n-1)return;z+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="8" fill="var(--dim)">${esc(v)}</text>`});return z+'</svg>';
}
function combo(labels,bars,line,H=230){

  bars.forEach((v,i)=>z+=`<rect x="${x(i)-bw/2}" y="${yb(v)}" width="${bw}" height="${H-B-yb(v)}" rx="2" fill="var(--accSoft)"><title>${esc(labels[i])} 매출 ${v}</title></rect>`);

  h+=`<section class="panel source"><h2>데이터 계보</h2><div class="cap">로컬 실물·공식 정의. 로컬 경로는 재현용.</div><table><tbody>${D.source_register.map(s=>`<tr><td>${/^https?:/.test(s.url)?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`:`<span class="stamp">${esc(s.label)}</span>`}</td><td class="wide note">${esc(s.note)}${/^\//.test(s.url)?` · ${esc(s.url)}`:''}</td></tr>`).join('')}</tbody></table></section>`;document.getElementById('global').innerHTML=h;
}
function render(){drawControls();overview();detail();global();document.getElementById('headSub').textContent=`브랜드·EMS/HPS·ODM·레일 부품 · 기준일 ${D.asof} · 실적/가이던스/파생 분리 · ${D.unit_policy}`;document.getElementById('foot').innerHTML=`<b>방법·한계</b> — ${Object.values(D.method).map(esc).join(' / ')}<br><b>면책</b> — ${esc(D.disclaimer)}`}
document.getElementById('themeBtn').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};render();
</script></body></html>
