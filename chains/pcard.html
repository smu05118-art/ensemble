*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  margin:0;padding:22px 18px 60px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto}
header{margin-bottom:16px;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:
  radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 1.6px) 0 0/14px 14px, var(--panel)}
h1{font-size:19px;margin:0 0 4px;font-weight:800;letter-spacing:-.2px}
.sub{font-size:11.5px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px}
.chip{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);cursor:pointer;color:var(--dim);background:var(--panel);user-select:none}
.chip.on{background:var(--accSoft);color:var(--acc);border-color:var(--acc);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th{font-size:10.5px;color:var(--dim);text-align:left;font-weight:600;letter-spacing:.03em;padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr.sel{background:var(--accSoft)}
tbody tr{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.stat .k{font-size:10px;color:var(--dim);letter-spacing:.05em}
.stat .v{font-size:19px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
.stat .s{font-size:10px;color:var(--dim);margin-top:2px}
h2{font-size:13.5px;margin:0 0 2px;font-weight:800}
.cap{font-size:10.5px;color:var(--dim);margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:var(--dim);margin:6px 0 2px}
.legend span{cursor:pointer;display:inline-flex;align-items:center;gap:5px;user-select:none}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend .off{opacity:.35;text-decoration:line-through}
.toggle{display:flex;gap:6px;margin:2px 0 6px}
.toggle span{font-size:10.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer;color:var(--dim)}
.toggle span.on{background:var(--accSoft);color:var(--acc);font-weight:700}
svg text{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:10.5px;color:var(--dim);line-height:1.6}
.pos{color:var(--pos)}.neg{color:var(--neg)}
footer{font-size:10px;color:var(--dim);margin-top:22px;line-height:1.7}
@media (prefers-reduced-motion:no-preference){.chip,.toggle span{transition:background .15s,color .15s}}

.enh-head{font-size:15px;margin:20px 0 10px}.enh-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px}
.enh-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.enh-card .eyebrow{font-size:9.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}.enh-card .big{font:800 18px var(--mono);margin:3px 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:9px;color:var(--dim)}
.tag.ok{color:var(--pos);border-color:var(--pos)}.tag.warn{color:var(--amber);border-color:var(--amber)}.tag.no{color:var(--neg);border-color:var(--neg)}
.linklist{columns:2;column-gap:24px}.linklist a{color:var(--acc);text-decoration:none;overflow-wrap:anywhere}.linklist div{break-inside:avoid;margin:5px 0;font-size:10.5px}.wraptext{white-space:normal;min-width:190px}.honesty{border-left:3px solid var(--amber)}
@media(max-width:700px){.linklist{columns:1}}

function pcInsight(k,c){
  const fq=(c.fin_q&&Object.keys(c.fin_q).length)?c.fin_q:null;
  const F={};if(fq)Object.assign(F,fq);else{Object.assign(F,c.fin_h||{},c.fin_fy||{});}
  const ks=dedupe(Object.keys(F));if(!ks.length)return null;
  const last=ks[ks.length-1],v=F[last]||{},pv=F[ks[ks.length-2]]||{};
  const py=F[yoyKey(last)]||null;
  const pct=x=>x==null?'—':(x>0?'+':'')+x.toFixed(1)+'%';
  const revYoY=(py&&py.rev&&v.rev!=null)?(v.rev/py.rev-1)*100:null;
  const opYoY=(py&&py.op>0&&v.op!=null&&v.op>0)?(v.op/py.op-1)*100:null;
  const qoq=(pv.rev&&v.rev!=null)?(v.rev/pv.rev-1)*100:null;
  const opm=(v.op!=null&&v.rev)?v.op/v.rev*100:null;
  const opmPy=(py&&py.op!=null&&py.rev)?py.op/py.rev*100:null;
  const record=fq&&ks.every(q=>(F[q].rev==null)||F[q].rev<=v.rev);
  const turnPos=v.op>0&&py&&py.op!=null&&py.op<=0;
  const turnNeg=v.op!=null&&v.op<=0&&py&&py.op>0;
  let up=0;for(let i=ks.length-1;i>0;i--){const a=F[ks[i]].rev,b=F[ks[i-1]].rev;if(a==null||b==null||a<=b)break;up++;}
  let verdict='혼조·횡보',vc='var(--dim)';
  if(revYoY==null){verdict='데이터 확인';}
  else if(turnPos){verdict='턴어라운드';vc='var(--pos)';}
  else if(revYoY>=25&&(opYoY==null||opYoY>=0)){verdict='가속';vc='var(--pos)';}
  else if(revYoY>=5){verdict='모멘텀 양호';vc='var(--acc)';}
  else if(turnNeg||revYoY<=-15){verdict='감속·경계';vc='var(--neg)';}
  else if(revYoY<=-3){verdict='둔화';vc='var(--neg)';}

  const prods=c.products||{};let drv=null,drag=null;
  const pk=dedupe(Object.keys(prods).flatMap(p=>['국내','수출','소계'].flatMap(r=>Object.keys(prods[p][r]||{}))));
  const pl=pk[pk.length-1],ppy=pl?yoyKey(pl):null;
  let exNow=0,exPy=0,totNow=0,totPy=0;
  if(pl){Object.keys(prods).forEach(p=>{const d=prods[p];
    const t=q=>{const a=(d['국내']||{})[q],b=(d['수출']||{})[q];return (a!=null||b!=null)?(a||0)+(b||0):((d['소계']||{})[q]);};
    const n0=t(pl),n1=t(ppy);
    exNow+=((d['수출']||{})[pl])||0;exPy+=((d['수출']||{})[ppy])||0;totNow+=n0||0;totPy+=n1||0;
    if(n0!=null&&n1){const dl=n0-n1;
      if(!drv||dl>drv.dl)drv={p,dl,yoy:(n0/n1-1)*100,n0};
      if(!drag||dl<drag.dl)drag={p,dl,yoy:(n0/n1-1)*100};}});}
  const exShNow=totNow?exNow/totNow*100:null,exShPy=totPy?exPy/totPy*100:null;
  const bullets=[];
  bullets.push(`${last} 매출 ${fmt(v.rev)} (YoY ${pct(revYoY)}${qoq!=null?' · QoQ '+pct(qoq):''})${record?' — <b>분기 사상최대</b>':''}${up>=3?` · ${up}분기 연속 증가`:''}`);
  if(v.op!=null)bullets.push(`영업이익 ${fmt(v.op)}${opm!=null?` (OPM ${opm.toFixed(1)}%${opmPy!=null?` ← 전년 ${opmPy.toFixed(1)}%`:''})`:''}${turnPos?' — <b>흑자전환</b>':turnNeg?' — <b>적자전환</b>':opYoY!=null?` · YoY ${pct(opYoY)}`:''}${(opm!=null&&opmPy!=null)?(opm>opmPy+1?' → 레버리지 확대':opm<opmPy-1?' → 마진 압축':''):''}`);
  if(drv&&drv.dl>0)bullets.push(`드라이버는 <b>${drv.p}</b> (${pl} 합 ${fmt(drv.n0)}, YoY ${pct(drv.yoy)})${drag&&drag.dl<0?` — 드래그는 ${drag.p}(${pct(drag.yoy)})`:''}`);
  else if(drag&&drag.dl<0)bullets.push(`전 품목 중 <b>${drag.p}</b>가 최대 드래그 (YoY ${pct(drag.yoy)})`);
  if(exShNow!=null&&exShPy!=null&&exShPy>0&&Math.abs(exShNow-exShPy)>=1)bullets.push(`수출비중 ${exShPy.toFixed(0)}%→<b>${exShNow.toFixed(0)}%</b> (${exShNow>exShPy?'수출':'내수'} 주도로 믹스 이동)`);
  const bkA=c.backlog||{};const bkK=Object.keys(bkA).sort((a,b)=>pOrd(a)-pOrd(b));const bq=bkK[bkK.length-1];
  if(bq!=null){const bv=bkA[bq];const bpy=bkA[yoyKey(bq)];const bY=bpy?(bv/bpy-1)*100:null;
    const f3=(c.fin_q||{})[bq];const covx=(f3&&f3.rev)?bv/f3.rev:null;
    bullets.push(`수주잔고 ${fmt(bv)} (${bq}${bY!=null?', YoY '+pct(bY):''})${covx!=null?` — 분기매출의 <b>${covx.toFixed(2)}배</b>${covx>=1.2?' · 백로그 두터움':covx<0.5?' · 짧은 사이클(수주→납품 빠름)':''}`:''}`);}
  return {verdict,vc,bullets,last};
}

function axisMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function svgCombo(labels,rev,op,H,nm){
  nm=nm||['매출','영업이익'];
  H=H||250;const W=1040,L=58,R=56,T=14,B=34,iw=W-L-R,ih=H-T-B;
  const rMax=axisMax(Math.max(1,...rev.filter(v=>v!=null)));
  const oVals=op.filter(v=>v!=null);
  const oMax=axisMax(Math.max(1,...oVals.map(v=>Math.abs(v))));
  const oMin=Math.min(0,...oVals),hasNegO=oMin<0;
  const oLo=hasNegO?-oMax:0;
  const n=labels.length,bw=Math.max(2,iw/n*0.62),step=iw/n;
  const xC=i=>L+step*(i+.5);
  const yR=v=>T+ih-(v/rMax)*ih;
  const yO=v=>T+ih-((v-oLo)/(oMax-oLo))*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">`;
  for(let g=0;g<=4;g++){const y=T+ih*g/4;
    s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    s+=`<text x="${L-6}" y="${y+3}" font-size="9" fill="var(--dim)" text-anchor="end">${fmt(rMax*(1-g/4))}</text>`;
    s+=`<text x="${W-R+6}" y="${y+3}" font-size="9" fill="var(--amber)" text-anchor="start">${fmt(oLo+(oMax-oLo)*(1-g/4))}</text>`;}
  rev.forEach((v,i)=>{if(v==null)return;
    s+=`<rect x="${xC(i)-bw/2}" y="${Math.min(yR(v),yR(0))}" width="${bw}" height="${Math.abs(yR(0)-yR(v))||1}" fill="var(--acc)" opacity=".78"><title>${labels[i]} ${nm[0]} ${fmt(v)}</title></rect>`;});
  if(hasNegO)s+=`<line x1="${L}" x2="${W-R}" y1="${yO(0)}" y2="${yO(0)}" stroke="var(--dim)" stroke-width="1" stroke-dasharray="3,3"/>`;
  let path='',pen=false;
  op.forEach((v,i)=>{if(v==null){return;}path+=(pen?'L':'M')+xC(i).toFixed(1)+' '+yO(v).toFixed(1)+' ';pen=true;});
  s+=`<path d="${path}" fill="none" stroke="var(--amber)" stroke-width="2"/>`;
  op.forEach((v,i)=>{if(v==null)return;
    s+=`<circle cx="${xC(i)}" cy="${yO(v)}" r="2.6" fill="var(--amber)"><title>${labels[i]} ${nm[1]} ${fmt(v)}</title></circle>`;});
  const tick=Math.ceil(n/14);
  labels.forEach((lb,i)=>{if(i%tick&&i!==n-1)return;
    s+=`<text x="${xC(i)}" y="${H-10}" font-size="8.5" fill="var(--dim)" text-anchor="middle">${lb}</text>`;});
  return s+'</svg>';
}
function svgStack(labels,series,H){
  H=H||300;const W=1040,L=58,R=10,T=14,B=34,iw=W-L-R,ih=H-T-B;
  const n=labels.length,step=iw/n,bw=Math.max(2,step*0.66);
  const totPos=labels.map((_,i)=>series.reduce((s,d)=>s+Math.max(0,d.data[i]||0),0));
  const totNeg=labels.map((_,i)=>series.reduce((s,d)=>s+Math.min(0,d.data[i]||0),0));
  const yMax=axisMax(Math.max(1,...totPos));
  const yMin=Math.min(0,...totNeg);
  const yy=v=>T+ih-((v-yMin)/(yMax-yMin))*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">`;
  for(let g=0;g<=4;g++){const val=yMax*(1-g/4)+yMin*(g/4),y=yy(val);
    s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    s+=`<text x="${L-6}" y="${y+3}" font-size="9" fill="var(--dim)" text-anchor="end">${fmt(val)}</text>`;}
  labels.forEach((lb,i)=>{
    let acc=0,accN=0;const x=L+step*(i+.5)-bw/2;
    series.forEach(d=>{const v=d.data[i];if(v==null||v===0)return;
      if(v>0){const y0=yy(acc),y1=yy(acc+v);
        s+=`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(.5,y0-y1)}" fill="${d.color}"><title>${lb} · ${d.label}: ${fmt(v)}</title></rect>`;acc+=v;}
      else{const y0=yy(accN),y1=yy(accN+v);
        s+=`<rect x="${x}" y="${y0}" width="${bw}" height="${Math.max(.5,y1-y0)}" fill="${d.color}"><title>${lb} · ${d.label}: ${fmt(v)}</title></rect>`;accN+=v;}});
  });
  const tick=Math.ceil(n/14);
  labels.forEach((lb,i)=>{if(i%tick&&i!==n-1)return;
    s+=`<text x="${L+step*(i+.5)}" y="${H-10}" font-size="8.5" fill="var(--dim)" text-anchor="middle">${lb}</text>`;});
  return s+'</svg>';
}
function svgLines(labels,series,H){

  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">`;
  for(let g=0;g<=4;g++){const val=yMax-(yMax-yMin)*g/4,y=T+ih*g/4;
    s+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    s+=`<text x="${L-6}" y="${y+3}" font-size="9" fill="var(--dim)" text-anchor="end">${val.toFixed(0)}</text>`;}
  series.forEach(sr=>{let p='',pen=false;

    s+=`<path d="${p}" fill="none" stroke="${sr.color}" stroke-width="1.8"/>`;
    sr.data.forEach((v,i)=>{if(v==null)return;s+=`<circle cx="${xc(i)}" cy="${yy(v)}" r="2.2" fill="${sr.color}"><title>${labels[i]} · ${sr.label}: ${v}</title></circle>`;});});
  const tick=Math.ceil(n/12);
  labels.forEach((lb,i)=>{if(i%tick&&i!==n-1)return;s+=`<text x="${xc(i)}" y="${H-10}" font-size="8.5" fill="var(--dim)" text-anchor="middle">${lb}</text>`;});

}
