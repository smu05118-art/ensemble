*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  margin:0;padding:22px 18px 60px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto}
header{margin-bottom:16px;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:
  radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 1.6px) 0 0/14px 14px, var(--panel)}
h1{font-size:19px;margin:0 0 4px;font-weight:800;letter-spacing:-.2px}
.sub{font-size:11.5px;color:var(--dim)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px}
.chip{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);cursor:pointer;color:var(--dim);background:var(--panel);user-select:none}
.chip.on{background:var(--accSoft);color:var(--acc);border-color:var(--acc);font-weight:700}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th{font-size:10.5px;color:var(--dim);text-align:left;font-weight:600;letter-spacing:.03em;padding:5px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr.sel{background:var(--accSoft)}
tbody tr{cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.stat .k{font-size:10px;color:var(--dim);letter-spacing:.05em}
.stat .v{font-size:19px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
.stat .s{font-size:10px;color:var(--dim);margin-top:2px}
h2{font-size:13.5px;margin:0 0 2px;font-weight:800}
.cap{font-size:10.5px;color:var(--dim);margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:var(--dim);margin:6px 0 2px}
.legend span{cursor:pointer;display:inline-flex;align-items:center;gap:5px;user-select:none}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend .off{opacity:.35;text-decoration:line-through}
.toggle{display:flex;gap:6px;margin:2px 0 6px}
.toggle span{font-size:10.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer;color:var(--dim)}
.toggle span.on{background:var(--accSoft);color:var(--acc);font-weight:700}
svg text{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{font-size:10.5px;color:var(--dim);line-height:1.6}
.pos{color:var(--pos)}.neg{color:var(--neg)}
footer{font-size:10px;color:var(--dim);margin-top:22px;line-height:1.7}
@media (prefers-reduced-motion:no-preference){.chip,.toggle span{transition:background .15s,color .15s}}

.enh-head{font-size:15px;margin:20px 0 10px}.enh-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:12px}
.enh-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.enh-card .eyebrow{font-size:9.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}.enh-card .big{font:800 18px var(--mono);margin:3px 0}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:9px;color:var(--dim)}
.tag.ok{color:var(--pos);border-color:var(--pos)}.tag.warn{color:var(--amber);border-color:var(--amber)}.tag.no{color:var(--neg);border-color:var(--neg)}
.linklist{columns:2;column-gap:24px}.linklist a{color:var(--acc);text-decoration:none;overflow-wrap:anywhere}.linklist div{break-inside:avoid;margin:5px 0;font-size:10.5px}.wraptext{white-space:normal;min-width:190px}.honesty{border-left:3px solid var(--amber)}
@media(max-width:700px){.linklist{columns:1}}

s":["FORM_Q2_RELEASE"]},"consensus":null},"thesis":"FormFactor의 2026-Q3(FY26 Q3, 9/26 종료) 매출 기준은 회사 가이던스 $260M~$280M(중값 $270M)이며, Q2 실적 $258.2M 대비 하단 +0.7%, 중값 +4.6%를 전제한다. Q2 DRAM 전년 대비 증가분의 약 75%가 HBM 기여였고, 공식 제품별 매출에서는 Foundry\u0026Logic이 최대 비중이며 Systems가 크게 증가했다. 회사는 Triton CPO 테스트 시스템을 Systems 성장의 주동력으로 설명했다. 재고 증가율(+7.6% QoQ)은 매출 증가율(+14.2%)보다 낮았고 증가분은 원재료·재공품에 집중됐다. 이는 생산 투입 확대와 맞는 모습이지만 향후 출하를 확정하는 증거는 아니다. Q3 수익성은 관세 환급의 실제 손익 반영과 Farmers Branch 신공장 비용을 함께 봐야 한다. 환급 수령액만으로 정상화 마진을 계산하지 않는다. 10/28 장 마감 후 실적과 이어지는 컨퍼런스콜에서는 매출 가이드 달성, 제품별 성장, 마진 조정항목과 Q4 가이던스가 핵심이다. Teradyne 지분투자는 조건 충족 후 Q4 종결 예상이며 주식수·현금 영향은 종결 시점에 연결된다.","sections":[{"id":"s01_baseline","title":"가이드 기반 매출 베이스라인: Q2 실적에서 Q3 FY26 범위로","body":["본 프리뷰의 대상 분기는 FY2026 Q3(캘린더 2026-Q3, 2026-09-26 종료 13주 분기)이며 매출 베이스라인은 회사가 2026-07-29 Q2 실적 발표에서 제시한 가이던스 $270M ±$10M, 즉 $260M~$280M 범위다. 중값 270은 회사가 제시한 값이고 본 프리뷰가 독자적으로 산출한 예측치가 아니다. 첨부의 2026-10-15 기준 컨센서스는 제공사 집계자료로 재현되지 않아 가이던스 대비 IN LINE·상회·하회 판정은 하지 않으며, 사용자 스크린샷의 컨센서스 수치는 컨센서스 출처 비교 섹션과 출처 한계 섹션에 미검증 참조값으로만 남긴다.","최신 검증 실적인 2026-Q2 매출은 $258.242M으로 전분기(226.144) 대비 +14.2%, 전년동기(195.798) 대비 +31.9%였고 회사는 사상 최고 매출·총이익·EPS로 기술했다. 가이드 범위를 Q2 실적과 비교하면 하단 260은 +0.7%, 중값 270은 +4.6%, 상단 280은 +8.4%에 해당해 하단조차 전분기 수준 이상을 전제한다. 전년동기 2025-Q3 매출(202.676, SEC XBRL 이력 대조)과 비교하면 가이드 범위는 +28.3%~+38.2%로, 성장률 기준으로는 Q2의 +31.9% YoY와 비슷한 수준이 유지되는 구간이다. 차트의 2024-Q1~2026-Q2 매출 10개 값은 이번 SEC XBRL 조회 이력과 모두 대조했다. 2024-Q4와 2025-Q4는 같은 회계연도의 연간 매출에서 Q1~Q3 매출을 뺀 계산값이다. 공시 제출일을 2026-10-15까지로 제한했지만 조회 시점의 이력이며 각 과거 시점에 동결한 자료는 아니다.","Q3 실적은 미국시간 2026-10-28 장 마감 후 발표될 예정이며, 컨퍼런스콜은 같은 날 13:25 PT(한국시간 10-29 05:25)다. 검증된 Q3 실적이 확보되면 현재 판단은 보존하고 다음 대상인 2026-Q4 프리뷰를 갱신한다. 새 분기 가이던스가 없으면 매출 판단을 보류하며 현재의 Q3 가이던스를 이월하지 않는다. 10월 Teradyne 지분투자 공시는 이번 Q3 실적 기간 종료 후의 사건으로 별도 표시한다."],"source_ids":["FORM_Q2_RELEASE","FORM_Q2_10Q","FORM_Q3_DATE","PCARD_C01_SNAPSHOT","SEC_COMPANYFACTS_FORM"],"table":{"columns":["항목","값(USD_M)","구분","2026-Q2 실적 대비(계산값)","2025-Q3 대비(계산값)"],"rows":[["2025-Q3 매출(전년동기)",202.676,"SEC XBRL 이력 대조(현재 조회 이력 · 제출일 2026-10-15까지)",null,null],["2026-Q1 매출",226.144,"회사 발표(10-Q)",null,null],["2026-Q2 매출(최신 검증 실적)",258.242,"회사 발표(실적 발표·10-Q)","+14.2% QoQ / +31.9% YoY",null],["2026-Q3 가이드 하단",260,"회사 가이드(2026-07-29)","+0.7%","+28.3%"],["2026-Q3 가이드 중값",270,"회사 가이드 중값","+4.6%","+33.2%"],["2026-Q3 가이드 상단",280,"회사 가이드(2026-07-29)","+8.4%","+38.2%"],["2026-Q3 실적",null,"미발표(2026-10-28 미국 장 마감 후 예정)",null,null]]},"chart":{"kind":"line","title":"FormFactor 분기 매출 실적과 2026-Q3 회사 가이던스 범위(USD_M)","labels":["2024-Q1","2024-Q2","2024-Q3","2024-Q4","2025-Q1","2025-Q2","2025-Q3","2025-Q4","2026-Q1","2026-Q2","2026-Q3"],"series":[{"name":"분기 매출(SEC XBRL 이력 대조; Q4는 연간−Q1~Q3 계산값)","values":[168.725,197.474,207.917,189.483,171.356,195.798,202.676,215.163,226.144,258.242,null],"unit":"USD_M"},{"name":"회사 가이드 하단(guide)","values":[null,null,null,null,null,null,null,null,null,null,260],"unit":"USD_M"},{"name":"회사 가이드 중값(guide)","values":[null,null,null,null,null,null,null,null,null,null,270],"unit":"USD_M"},{"name":"회사 가이드 상단(guide)","values":[null,null,null,null,null,null,null,null,null,null,280],"unit":"USD_M"}],"source_ids":["PCARD_C01_SNAPSHOT","FORM_Q2_RELEASE","FORM_Q2_10Q","SEC_COMPANYFACTS_FORM"]}},{"id":"s01b_consensus_sources","title":"시장 컨센서스 출처 비교: 10-15 스크린샷 값과 10-19 조회 Finviz 이력(참고 관측 · 헤드라인 판정 불변)","body":["사용자 첨부 스크린샷의 Q3 270.469·Q4 277.522 USD_M(2026-10-15 기준)은 제공사의 기초 집계자료와 제공사명이 확인되지 않아 여전히 미검증이며, 본 프리뷰의 컨센서스 항목은 null을 유지하고 가이드 대비 IN LINE·상회·하회 판정도 하지 않는다. 별도로 Finviz 공개 페이지를 2026-10-19 01:23 KST(UTC 10-18 16:23)에 직접 조회해 Q3 매출 추정치의 일자별 이력과 Q4 현재 표시값을 확인했다. 이는 조회 시점에 페이지가 반환한 '현재 조회 이력'이며 10-15 당시에 동결된 스냅샷이 아니다. 과거 일자 행도 이후 정정될 수 있다.","Finviz Q3 매출 추정치 이력은 10-02 270.4686(10명), 10-05 270.4386(10명), 10-13 270.5207(9명), 10-15 270.5163(9명)이며 현재 표시값은 10-15 행과 같은 270.5163(9명, 범위 270~273)이다. 10-02 행은 소수 셋째 자리 반올림 시 스크린샷의 270.469와 일치하지만, 숫자 일치만으로 스크린샷의 제공사가 Finviz 또는 그 상류 벤더라고 단정할 수 없고 스크린샷이 틀렸다고 판단할 수도 없다. 10-15 행과 스크린샷의 차이 0.0473 USD_M은 출처·시점 차이로만 기록한다. Q4 현재 표시값 278.3594(9명)는 반환 데이터에 일자별 이력이 없어 수정일을 알 수 없으므로 10-15 Q4 값이라고 부르지 않으며, 스크린샷 277.522와의 차이 0.8374는 동일 시점 비교가 아니다.","단위는 Finviz 원시 JSON에 통화·단위 필드가 없으나 2026-Q2 salesActual 258.242가 공식 연결 매출(USD 백만)과 일치해 USD_M으로 대응시켰다. Finviz의 분기 종료일 표시(2026-09-30·12-31)는 월말 표기이며 회사의 실제 회계 분기 종료일(2026-09-26)을 대체하지 않는다. 상류 추정치 벤더는 미확인이고 페이지 전문·전체 데이터는 재배포 권한이 확인되지 않아 내부 보관하며, 여기에는 출처를 명시한 소수의 비교값만 싣는다. 가이드 중값 270은 스크린샷 270.469 대비 −0.17%, Finviz 10-15 행 270.5163 대비 −0.19%(모두 계산값)이며 두 비율은 출처·시점이 다른 값에 대한 계산이다. 다음 갱신 시에는 새 조회 시각이 찍힌 출처를 다시 받아 비교하고, 이번 10-19 관측치를 다음 분기 값으로 이월하지 않는다."],"source_ids":["FINVIZ_FORM_EARNINGS_20261019","USER_ATTACHMENT_REF","FORM_Q2_RELEASE"],"table":{"columns":["항목","값(USD_M)","애널리스트 수","일자 구분","출처 · 상태"],"rows":[["스크린샷 Q3 컨센서스(원 주장)",270.469,null,"2026-10-15 기준(첨부 표기)","제공사 기초 집계자료·제공사명 미확인 → 미검증, 헤드라인 미채택"],["스크린샷 Q4 컨센서스(원 주장)",277.522,null,"2026-10-15 기준(첨부 표기)","미검증"],["Finviz Q3 이력 10-02",270.4686,10,"estimateDate 2026-10-02(2026-10-19 조회 이력)","반올림 시 270.469와 일치 · 제공사 동일성 입증 아님"],["Finviz Q3 이력 10-05",270.4386,10,"estimateDate 2026-10-05(2026-10-19 조회 이력)","현재 조회 이력"],["Finviz Q3 이력 10-13",270.5207,9,"estimateDate 2026-10-13(2026-10-19 조회 이력)","현재 조회 이력"],["Finviz Q3 이력 10-15",270.5163,9,"estimateDate 2026-10-15(2026-10-19 조회 이력)","현재 표시값과 동일; 스크린샷과 0.0473 차이(출처·시점 차이)"],["Finviz Q3 현재 표시값",270.5163,9,"2026-10-19 KST 관측(범위 270~273)","참고 관측 · 컨센서스 항목 미채택"],["Finviz Q4 현재 표시값",278.3594,9,"2026-10-19 KST 관측 · 수정일 미제공","10-15 값 아님; 스크린샷과 0.8374 차이는 동일 시점 비교 아님"],["회사 Q3 가이드 중값",270,null,"2026-07-29 발표","스크린샷 대비 −0.17%, Finviz 10-15 행 대비 −0.19%(계산값)"]]},"chart":null},{"id":"s02_segments","title":"제품·제조 체인: 세그먼트 구조와 Q3 믹스 함의","body":["FormFactor의 매출은 프로브카드(DRAM, Flash, Foundry\u0026Logic)와 Systems(프로브 스테이션·크라이오·CPO 테스트 시스템 등)로 분해된다. 2026-Q2 기준 Foundry\u0026Logic 121.839(비중 47.2%), DRAM 84.999(32.9%), Systems 48.547(18.8%), Flash 2.857(1.1%)이며 프로브카드 합계는 209.695로 전체의 81.2%다. 프로브카드는 고객 웨이퍼 설계별 주문생산 소모품이어서 신규 디자인 승인과 고객 팹 가동률이 분기 매출을 좌우하고, Systems는 장비 성격이라 인도 시점에 따라 분기 변동이 크다.","전분기 대비로는 Systems가 27.887에서 48.547로 +74.1% 뛰며 Q2 증가분의 상당 부분을 설명했고 Foundry\u0026Logic +9.6%, DRAM +2.5%, Flash −30.9%였다. 전년 대비로는 DRAM +49.0%, Systems +44.1%, Foundry\u0026Logic +22.4%, Flash −48.4%다. Q3 가이드 중값 270은 Q2 대비 +11.8 증분을 뜻하는데, 기존 기록의 가이던스 노트는 CEO가 Foundry\u0026Logic 강세와 Systems 모멘텀을 근거로 '또 한 번의 사상 최고 매출·수익성'을 언급했다고 기록한다(기존 기록 요약이며 원문 인용은 미검증). 따라서 Q3 관전의 핵심은 Systems가 48.5 수준을 유지하는지, 그리고 F\u0026L이 DRAM의 완만한 성장을 보완하는지다.","2025-Q2와 2026-Q2 제품별 매출은 Q2 분기 공시의 매출 분해표(본문 22쪽), 2026-Q1은 Q1 분기 공시(본문 21쪽)에서 각각 확인했다. 각 구성 합계는 보고 총매출과 일치한다. 차트의 다른 과거 분기는 기존 기록으로 독립 재검증하지 않았으며, 2024-Q4와 2025-Q4 구성은 연간 수치에서 9개월 누적 수치를 뺀 계산값이다."],"source_ids":["FORM_Q2_10Q","FORM_Q1_10Q","FORM_Q2_RELEASE","PCARD_C01_SNAPSHOT"],"table":{"columns":["세그먼트","2025-Q2(USD_M)","2026-Q1(USD_M)","2026-Q2(USD_M)","QoQ(계산값)","YoY(계산값)","2026-Q2 비중(계산값)"],"rows":[["DRAM 프로브카드",57.057,82.933,84.999,"+2.5%","+49.0%","32.9%"],["Flash 프로브카드",5.538,4.136,2.857,"-30.9%","-48.4%","1.1%"],["Foundry\u0026Logic 프로브카드",99.513,111.188,121.839,"+9.6%","+22.4%","47.2%"],["Systems",33.69,27.887,48.547,"+74.1%","+44.1%","18.8%"],["합계(회사 발표)",195.798,226.144,258.242,"+14.2%","+31.9%","100.0%"]]},"chart":{"kind":"stack","title":"세그먼트별 분기 매출(USD_M; 2025-Q2·2026-Q1·Q2 공식 확인, 나머지는 기존 기록·독립 재검증 없음; 2024-Q4·2025-Q4는 연간−9개월 계산값)","labels":["2024-Q1","2024-Q2","2024-Q3","2024-Q4","2025-Q1","2025-Q2","2025-Q3","2025-Q4","2026-Q1","2026-Q2"],"series":[{"name":"DRAM","values":[45.896,58.042,60.184,63.3,48.858,57.057,68.182,73.3,82.933,84.999],"unit":"USD_M"},{"name":"Flash","values":[4.037,5.09,4.544,3.685,2.39,5.538,5.265,7.411,4.136,2.857],"unit":"USD_M"},{"name":"Foundry\u0026Logic","values":[86.768,103.66,107.446,83.308,85.272,99.513,92.933,92.179,111.188,121.839],"unit":"USD_M"},{"name":"Systems","values":[32.024,30.682,35.743,39.19,34.836,33.69,36.296,42.273,27.887,48.547],"unit":"USD_M"}],"source_ids":["PCARD_C01_SNAPSHOT","FORM_Q2_10Q","FORM_Q1_10Q"]}},{"id":"s03_demand_axes","title":"HBM·DDR·로직·CPO: 수요 축별 검증 증거와 미검증 발언의 분리","body":["HBM 축에서 검증된 사실은 'Q2 DRAM 매출의 전년 대비 증가분 가운데 약 75%가 HBM에 기인한다'는 회사 설명이다. DRAM 증가분은 84.999−57.057=27.942이므로 HBM 기여는 약 21(파생·근사)이다. 이 수치는 HBM이 DRAM 매출에서 차지하는 비중이 아니라 증가분 기여도이며, 사용자 스크린샷의 콜 발언 'HBM이 Q2 DRAM 매출의 약 2/3, Q3 DRAM은 보합이며 HBM에서 DDR로 믹스 이동'은 다른 지표에 대한 서술로 첨부 원문의 설명은 확인했으나 회사 콜 원자료와는 대조하지 못해 미검증으로 둔다. 두 서술은 서로 모순되지 않지만 본 프리뷰가 사실로 채택하는 것은 전자뿐이다. Q3에서 볼 지표는 DRAM 세그먼트가 85.0 수준에서 어디로 움직이는지와 회사가 HBM 기여를 다시 수치로 공시하는지다.","로직 축에서는 Foundry\u0026Logic이 최대 세그먼트(47.2%)로 +22.4% YoY 성장했다는 10-Q 수치가 검증 증거이며, 'Q3 GPU 양산 시작, 커스텀 ASIC은 2027년 의미 있는 규모'라는 콜 발언은 회사 콜 원자료 미대조다. CPO 축에서는 회사가 Triton CPO(co-packaged optics) 웨이퍼 테스트 시스템을 Systems 성장의 주동력으로 명시했고, Triton은 Advantest·Tokyo Electron과 공동 개발된 광·전기 동시 테스트와 웨이퍼 핸들링 솔루션이라는 점이 공식 제품 자료로 확인된다. 'CPO 누적 매출이 Q3 말 $20M을 넘는다'는 발언은 회사 콜 원자료 미대조다. Systems가 Q2에 +74.1% QoQ로 급증한 만큼 Q3에 같은 레벨이 유지되는지가 가이드 달성의 변수다.","DDR과 Flash는 상대적으로 약한 축이다. Flash는 2.857로 전체의 1.1%에 불과하고 −48.4% YoY로 축소됐으며, DDR은 DRAM 세그먼트 안에 HBM과 합산돼 별도 공시되지 않는다. 만약 미검증 발언대로 Q3에 HBM에서 DDR로 믹스가 이동한다면 DRAM 세그먼트 금액이 보합이어도 제품 복잡도와 단가 구성이 달라질 수 있으나, 이를 뒷받침할 검증 수치는 없으므로 가설로만 기록한다."],"source_ids":["FORM_Q2_RELEASE","FORM_Q2_SUPPLEMENT","FORM_Q2_10Q","FORM_TRITON","USER_ATTACHMENT_REF"],"table":{"columns":["수요 축","확인 자료·기존 기록(구분 표시)","미검증 콜 발언(기초 원자료 미대조 · 스크린샷 요약)","Q3 관전 지표"],"rows":[["HBM","Q2 DRAM YoY 증가분(27.942, 계산값)의 약 75%가 HBM 기여 → 약 21 USD_M(계산값·근사). 비중 아님","HBM ≈ Q2 DRAM 매출의 약 2/3; Q3 DRAM 보합, HBM→DDR 믹스 이동","DRAM 세그먼트 84.999 대비 증감, HBM 기여 재공시 여부"],["DDR / Flash","Flash 2.857(−48.4% YoY, 비중 1.1%); DDR 별도 미공시","(동일 발언 내 DDR 믹스 확대 언급)","Flash 바닥 여부, DRAM 내 DDR 언급"],["Foundry\u0026Logic","121.839(+22.4% YoY, 비중 47.2%); 이전 기존 기록 노트에 CEO의 F\u0026L 강세 언급 기록","Q3 GPU 양산 시작; 커스텀 ASIC 2027 의미 있는 규모","F\u0026L 분기 레벨과 신규 디자인·고객 언급"],["CPO / Systems","Systems 48.547(+74.1% QoQ, +44.1% YoY); Triton CPO 테스트 시스템이 Systems 성장 주동력(Advantest·TEL 공동 개발)","CPO 누적 매출 Q3 말 $20M 초과","Systems 레벨 유지 여부(분기별 변동성), Triton 수주·인도 언급"]]},"chart":null},{"id":"s04_trade_proxy","title":"무역지표: 선행·동행 해석과 확인 범위(HS903090000 범위·34개 세관 집계 기준 정정)","body":["HS903090000은 일본 수출통계 9단위 코드로 제9030호(오실로스코프·스펙트럼 분석기 등 전기량 측정·검사용 기기와 전리방사선 측정·검출기기) 전체의 부분품·부속품을 포괄하는 광의 코드다. 반도체 테스트 부품 전용 코드도, 프로브카드 전용 코드도, FormFactor 자체 수출도 아니므로 기업 매출 규모로 환산할 수 없고 업황 참고에 그친다. Q3 전체 역월 범위는 7~9월이며, 이번 상관 검산의 동행 창은 첫 두 달인 7~8월, 직전 역년 분기 창은 4~6월이다. 현재 공식 표는 2026년 1~8월분까지만 수록해 9월은 미관측이다. 같은 수출 바스켓의 시차만 바꾼 두 지표를 독립된 신호로 중복 계산하면 안 되고, 특정 일본 수출 흐름을 FormFactor 출하에 직접 귀속할 근거도 없다.","기존 기록의 일본→세계 HS903090000 시리즈(2026-06 42.81 / 07 34.54 / 08 24.92 JPY_B)는 전국 합계가 아니라 로컬 설정의 34개 세관 합계였다. 이번에 e-Stat 공개 다운로드(인증 없음)로 받은 공식 세관별·품목별·국별 수출표에서 전 세관·전 상대국 반환 행을 합산한 전국 값은 2026-06 42.824 / 07 34.552 / 08 24.963 JPY_B(각 42,824,484 / 34,551,935 / 24,962,760천엔)이며 3개월 합 YoY는 +37.6%, 8월 단월 YoY는 +5.3%다. 같은 공식 표를 동일 34개 세관으로 필터하면 기존 기록과 56개월 모두 일치해, 기존 값은 집계 범위 표기만 틀렸던 것으로 확인된다. 일본→한국(2026-06 21.06 / 07 13.34 / 08 7.25)과 수입 행은 기존 기록 그대로이며 전국 대조는 수행하지 않았다. 미국→한국 통계는 2026-05까지여서 Q3를 포함하지 않는다.","사용자 스크린샷의 동행 상관 0.79(방향 일치 10/12)·선행 상관 0.89(11/12)·8월 일본 수출 122.8 USD_M(+3.9%)은 첨부 원문에 기초 수출 시계열·HS 매핑·환율·관측 시점·방향 산식이 없어 재현할 수 없고 본 섹션의 근거로 쓰지 않는다. 다음 무역 감사 섹션의 전국 엔화 계산은 바스켓을 명시한 별도 대체 계산이며 원 계수의 검증이 아니다. 2026-Q3 창에 같은 정의를 적용한 관측값은 동행(7~8월) +19.2%, 직전 역년 분기(4~6월) +71.0%(전국 천엔 합계 기준 계산값)이지만 이는 기술 통계일 뿐 Q3 매출 추정 근거로 사용하지 않는다."],"source_ids":["ESTAT_HS903090000_EXPORT_2023_2026","ESTAT_TRADE_SNAPSHOT","PCARD_C01_SNAPSHOT","USER_ATTACHMENT_REF"],"table":{"columns":["무역 흐름","단위/원천","최신 3개월 값","3개월 합 YoY(계산값)","검증 상태","Q3 용도 한계"],"rows":[["일본→세계 HS903090000 수출(전국 합계 · 공식 표 전 세관 합산)","JPY_B(천엔 합산) · e-Stat 표 0004002162 · 2026-10-19 조회","2026-06 42.824 / 07 34.552 / 08 24.963","+37.6%","공식 원자료 확인(2026년분은 確報 · 수정 가능) · 기업 매출 예측력 미검증","7~8월 동행 창 확보 · 7~9월 전체 분기는 미완성; FFI 직접 귀속 불가"],["일본→세계 HS903090000 수출(34개 설정 세관 합계 · 기존 기록)","JPY_B · 기존 기록 집계(전국 아님)","2026-06 42.808 / 07 34.542 / 08 24.919","+37.6%","공식 표 동일 34개 세관 필터와 56개월 일치","전국 값과 바스켓이 다르므로 혼용 금지"],["일본→한국 HS903090000 수출(기존 기록 · 34개 세관 설정 파이프라인)","JPY_B · 기존 기록 집계","2026-06 21.06 / 07 13.34 / 08 7.25","+31.5%","전국 대조 미실시","동일 바스켓의 동행·지연 중복 사용 금지"],["일본←세계 HS903090000 수입(기존 기록)","JPY_B · 기존 기록 집계","2026-06 6.01 / 07 8.92 / 08 6.62","+50.3%","전국 대조 미실시","방향 참고만"],["미국→한국 HS903090 수출(FFI 미러 무역 흐름)","USD_M · us_long.csv","2026-03 5.74 / 04 4.18 / 05 7.37","-4.7%","기존 성능 판정 있음·원출처 재검증 불가","관측 2026-05 종료, Q3 미커버"],["FFI 분기 미러 시리즈(legacy)","USD_M(레벨 캘리 금지)","2026-Q1 91.9 / 2026-Q2 100.7",null,"원출처 추적 불충분·판단 근거에서 제외","차트화하지 않음"],["사용자 스크린샷 동행/선행 상관","달러 표기 확인 · 기초 바스켓·HS·환율 미확인","2026-08 122.8 USD_M(+3.9%)",null,"첨부 원문 확인 · 기초 시계열·산식이 없어 재현 불가; 전국 2026-08은 24,962,760천엔(+5.3%) · USD 환산 없음","출처 한계 섹션 참조; 전국 엔화 계산은 원 계수 검증 아님"],["2026-Q3 매칭 창 관측값(전국 합계 · 계산값)","YoY % · 무역 감사 섹션과 동일 정의","동행 7~8월 +19.2% / 직전 역년 분기 4~6월 +71.0%",null,"공식 원자료 기반 기술 통계","Q3 매출 추정 근거로 사용하지 않음; 첫 두 달 창은 고정하며 9월 포함 전체 분기는 별도 표시"]]},"chart":{"kind":"bar","title":"일본 HS903090000 월별 수출(JPY_B; 세계=전국 공식 합계 2026-10-19 조회, 한국=34개 세관 기존 기록; 예측력 미검증, 2026-09 미관측)","labels":["2026-06","2026-07","2026-08","2026-09"],"series":[{"name":"일본→세계 수출(전국 공식 합계)","values":[42.824,34.552,24.963,null],"unit":"JPY_B"},{"name":"일본→한국 수출(34개 설정 세관 합계 · 기존 기록)","values":[21.06,13.337,7.251,null],"unit":"JPY_B"}],"source_ids":["ESTAT_HS903090000_EXPORT_2023_2026","ESTAT_TRADE_SNAPSHOT"]}},{"id":"s04b_trade_audit","title":"무역지표 감사: 전국 HS903090000 엔화 수출 YoY와 FormFactor 매출 YoY의 기술 상관(고정 12쌍, 2023Q3~2026Q2)","body":["계산 대상은 e-Stat 공식 세관별 품목별 국별 수출표(표 0004002162: 2023년~2026년 1~8월, 표 0003425301: 2022년)에서 HS903090000의 전 세관·전 상대국 반환 행을 합산한 전국 월별 수출액(명목 천엔, 환율 환산 없음)과 SEC XBRL companyfacts의 FormFactor 분기 연결 매출(USD; Q4는 연간−Q1~Q3 계산값)이다. 무역 YoY = 100×(해당 창 월 합계 ÷ 전년 같은 월 합계 − 1), 매출 YoY = 100×(분기 매출 ÷ 4분기 전 매출 − 1), 상관은 두 YoY 계열의 표본 피어슨 상관계수, 방향 일치는 sign(무역 YoY) = sign(매출 YoY)(0은 0과만 일치)로 정의했다. 표본은 2023-Q3~2026-Q2의 고정 12쌍이며 시차·바스켓·환율을 조정해 특정 값에 맞추지 않았다.","두 창의 결과는 다음과 같다. 동행 창(대상 분기 역년 첫 2개월, 예: 2026-Q2는 4~5월) r = 0.790, YoY 부호 일치 9/12. 직전 역년 분기 창(대상 분기 직전 3개월, 예: 2026-Q2는 1~3월) r = 0.809, 부호 일치 10/12. 보조 진단으로 인접 분기 간 YoY 증감 방향 일치는 두 창 모두 6/11이다. 같은 정의를 기존 34개 세관 집계에 적용한 별도 검산 결과는 0.792 / 0.808(부호 9/12 · 10/12; 공식 원자료와 같은 범위의 56개월 값을 대조하고 재계산)이며 전국 값과 바스켓이 다르므로 별도 표기한다. 이 값들은 스크린샷의 0.79 / 0.89(10/12 · 11/12)와 통화가 다르고 바스켓·방향 정의의 동일성을 확인할 수 없는 별도 계산이고 원 계수의 재현이나 검증이 아니다.","한계는 네 가지다. 첫째 빈티지: 공식 표는 2026-10-19 조회 시점의 현재 값으로 2023~2024년 確定, 2025년 確々報, 2026년 1~8월 確報이며 과거 각 시점에 공개됐던 값의 보존본이 아니고, SEC 매출도 현재 조회된 XBRL 이력이다. 둘째 회계·역년 정렬: FormFactor는 13주 회계 분기(예: 2025-09-27 종료)이고 무역 통계는 역월이므로 창이 완전히 겹치지 않으며 보정하지 않았다. 셋째 12쌍의 사후 기술 통계로 인과나 예측력을 뜻하지 않으며 Q3 매출 추정에 쓰지 않는다. 넷째 결측 보간·재가중·환율 가정은 없고 공식 표의 9~12월 미수록 칸은 제외했다."],"source_ids":["ESTAT_HS903090000_EXPORT_2023_2026","ESTAT_HS903090000_EXPORT_2021_2022","SEC_COMPANYFACTS_FORM","ESTAT_TRADE_SNAPSHOT","USER_ATTACHMENT_REF"],"table":{"columns":["대상 분기(FFI 회계 분기 종료일)","FFI 매출 YoY(%)","동행 창(첫 2개월) 수출 YoY(%)","부호 일치(동행)","직전 역년 분기 수출 YoY(%)","부호 일치(직전 분기)"],"rows":[["2023-Q3(2023-09-30)",-5.1,-8.4,"일치",-18.2,"일치"],["2023-Q4(2023-12-30)",1.3,9.2,"일치",-3.2,"불일치"],["2024-Q1(2024-03-30)",0.8,20.1,"일치",12.2,"일치"],["2024-Q2(2024-06-29)",26.7,28.6,"일치",24.6,"일치"],["2024-Q3(2024-09-28)",21.2,24.2,"일치",28.1,"일치"],["2024-Q4(2024-12-28)",12.7,23.3,"일치",16.6,"일치"],["2025-Q1(2025-03-29)",1.6,-2.1,"불일치",10.6,"일치"],["2025-Q2(2025-06-28)",-0.8,4.4,"불일치",-4.3,"일치"],["2025-Q3(2025-09-27)",-2.5,18.9,"불일치",3.8,"불일치"],["2025-Q4(2025-12-27)",13.6,3.0,"일치",15.2,"일치"],["2026-Q1(2026-03-28)",32.0,36.8,"일치",13.2,"일치"],["2026-Q2(2026-06-27)",31.9,68.6,"일치",35.5,"일치"]]},"chart":{"kind":"line","title":"FormFactor 분기 매출 YoY와 전국 HS903090000 수출 YoY(PCT; 동행=해당 분기 첫 2개월, 직전=직전 역년 분기; 사후 기술 통계 · 예측력 미검증)","labels":["2023-Q3","2023-Q4","2024-Q1","2024-Q2","2024-Q3","2024-Q4","2025-Q1","2025-Q2","2025-Q3","2025-Q4","2026-Q1","2026-Q2"],"series":[{"name":"FFI 매출 YoY(SEC companyfacts)","values":[-5.1,1.3,0.8,26.7,21.2,12.7,1.6,-0.8,-2.5,13.6,32.0,31.9],"unit":"PCT"},{"name":"전국 수출 YoY · 동행 창(첫 2개월)","values":[-8.4,9.2,20.1,28.6,24.2,23.3,-2.1,4.4,18.9,3.0,36.8,68.6],"unit":"PCT"},{"name":"전국 수출 YoY · 직전 역년 분기","values":[-18.2,-3.2,12.2,24.6,28.1,16.6,10.6,-4.3,3.8,15.2,13.2,35.5],"unit":"PCT"}],"source_ids":["ESTAT_HS903090000_EXPORT_2023_2026","ESTAT_HS903090000_EXPORT_2021_2022","SEC_COMPANYFACTS_FORM"]}},{"id":"s05_inventory","title":"재고 구성과 증가율 vs 매출: Q3 생산 파이프라인 읽기","body":["Q2 10-Q 기준 재고는 121.409로 Q1 112.877 대비 +7.6% 늘었다. 구성별로는 원재료 55.920(+7.9%), 재공품 45.305(+9.5%), 완제품 20.184(+2.4%)로, 증가가 원재료와 재공품에 집중되고 완제품은 거의 늘지 않았다. 같은 기간 매출은 +14.2% 증가해 재고 증가율을 크게 웃돌았고, 재고/분기매출 비율은 49.9%에서 47.0%로 하락했다(파생값).","원재료·재공품 중심의 재고 증가는 생산 투입이 늘어난 모습과 부합하며 Q3 회사 가이드가 Q2보다 높다는 점과 함께 살펴볼 수 있다. 이는 재고 구성을 바탕으로 한 해석이며, 해당 재고가 다음 분기 출하로 이어진다는 확정 근거는 아니다. 완제품 증가폭은 상대적으로 작지만 그것만으로 미출하 재고나 수요 둔화 가능성을 배제할 수 없다. 신공장 준비를 위한 선행 자재 확보가 얼마나 포함됐는지도 공시에서 분리되지 않는다.","Q3에는 완제품·재공품의 변화와 매출 실현을 함께 확인한다. 완제품이 빠르게 늘면서 매출이 가이드 하단을 밑돌면 출하 지연이나 수요 변화 여부를 추가 점검할 수 있다. 반대로 재공품과 매출이 함께 늘더라도 다음 분기 수요를 확정하기보다 회사의 주문·생산 설명과 대조해야 한다."],"source_ids":["FORM_Q2_10Q","FORM_Q1_10Q","FORM_Q2_RELEASE"],"table":{"columns":["구성","2026-Q1(USD_M)","2026-Q2(USD_M)","QoQ(계산값)","2026-Q2 비중(계산값)"],"rows":[["원재료(raw materials)",51.802,55.92,"+7.9%","46.1%"],["재공품(work in process)",41.362,45.305,"+9.5%","37.3%"],["완제품(finished goods)",19.713,20.184,"+2.4%","16.6%"],["재고 합계(회사 발표)",112.877,121.409,"+7.6%","100.0%"],["분기 매출(회사 발표)",226.144,258.242,"+14.2%",null],["재고/분기매출(계산값)","49.9%","47.0%",null,null]]},"chart":{"kind":"stack","title":"재고 구성 적층(USD_M; 2026-Q3는 10-Q 발표 전)","labels":["2026-Q1","2026-Q2","2026-Q3"],"series":[{"name":"원재료","values":[51.802,55.92,null],"unit":"USD_M"},{"name":"재공품","values":[41.362,45.305,null],"unit":"USD_M"},{"name":"완제품","values":[19.713,20.184,null],"unit":"USD_M"}],"source_ids":["FORM_Q2_10Q","FORM_Q1_10Q"]}},{"id":"s06_margins","title":"경상 마진 vs 일회성: 관세 환급과 신공장 스타트업 비용","body":["Q2 총이익률은 GAAP 50.7%, non-GAAP 53.3%였고 Q3 가이드는 GAAP 52.0%±1.5pt, non-GAAP 54.0%±1.5pt다. Q2 희석 EPS는 GAAP $0.71, non-GAAP $0.82였으며 Q3 가이드는 GAAP $0.75±0.09, non-GAAP $0.86±0.09다. 회사는 Q3 관세 환급 $7M~$9M을 예상했고 Q2에는 $0.8M을 수령했다. 현금 수령액과 해당 분기 손익에 인식한 금액은 같다고 볼 수 없으므로, Q2 수령액을 총이익률에서 바로 차감해 정상화 마진을 산출하지 않는다.","Q3 가이드 매출 중값 $270M을 고정하고 예상 환급 $7M~$9M 전액이 같은 분기 매출원가에 반영된다고 가정할 때, 총이익률의 단순 민감도는 약 2.6~3.3%p다. 이는 가정을 둔 산술 비교이며 회사가 제시한 정상화 마진도, 환급을 제외한 경상 마진 전망도 아니다. 실제 손익 인식액·시점과 다른 조정항목을 확인하기 전에는 Q2 대비 경상 마진의 방향을 단정하지 않는다.","첨부 자료의 Q2 정상화 non-GAAP 총이익률 약 51%와 Q3 환급 효과 약 300bp는 회사 콜 원자료와의 대조가 남아 있다. 특히 Q2의 다른 회수이익·조정항목까지 대조해야 회사가 말한 정상화 기준을 재구성할 수 있다. Q3 non-GAAP 영업비용 $70M±$2M과 사전 생산비 약 $7M도 기초 원자료 미대조이다. 확인한 Q2 신공장 비용은 $4.859M이다. Q3 발표에서는 총이익률 자체와 환급 인식액·계정, 공장 비용, GAAP와 non-GAAP의 조정내역을 함께 확인한다."],"source_ids":["FORM_Q2_RELEASE","FORM_Q2_SUPPLEMENT","FORM_Q2_10Q","PCARD_C01_SNAPSHOT","USER_ATTACHMENT_REF"],"table":{"columns":["지표","2026-Q2 실적","2026-Q3 가이드 하단","2026-Q3 가이드 중값","2026-Q3 가이드 상단","구분"],"rows":[["GAAP 총이익률(%)",50.7,50.5,52.0,53.5,"회사 발표 / 회사 가이드"],["non-GAAP 총이익률(%)",53.3,52.5,54.0,55.5,"회사 발표 / 회사 가이드"],["GAAP EPS(USD)",0.71,0.66,0.75,0.84,"회사 발표(희석 EPS) / 회사 가이드"],["non-GAAP EPS(USD)",0.82,0.77,0.86,0.95,"회사 발표(희석 EPS) / 회사 가이드"],["관세 환급(USD_M)",0.8,7,null,9,"Q2 현금 수령액 / Q3 회사 예상 범위·손익 인식액과 구분"],["Q3 환급 가정 민감도(매출 270 고정)",null,"약 2.6%p",null,"약 3.3%p","예상 환급 전액을 같은 분기 매출원가에 인식한다고 가정한 단순 계산·정상화 마진 아님"],["공장 스타트업 비용(USD_M)",4.859,null,null,null,"회사 발표(10-Q); Q3 미공시"]]},"chart":{"kind":"bar","title":"총이익률: 2026-Q2 실적과 2026-Q3 회사 가이드 범위(%)","labels":["2026-Q2 실적","2026-Q3 가이드 하단","2026-Q3 가이드 중값","2026-Q3 가이드 상단"],"series":[{"name":"GAAP 총이익률","values":[50.7,50.5,52.0,53.5],"unit":"%"},{"name":"non-GAAP 총이익률","values":[53.3,52.5,54.0,55.5],"unit":"%"}],"source_ids":["FORM_Q2_RELEASE","FORM_Q2_SUPPLEMENT"]}},{"id":"s07_capacity_cash","title":"신규 캐파(Farmers Branch)와 현금흐름","body":["검증된 신공장 일정은 텍사스 Farmers Branch 공장이 2026년 4분기 후반에 생산을 시작하고 2027년에 걸쳐 초기 목표 수준까지 램프한다는 것이다. '2028년 초 초기 캐파 도달과 마진 가산'은 사용자 스크린샷 콜 발언이고, 이전 기존 기록의 '2030년 매출 모델 $1.6B·GM 55%'는 Investor Day 요약으로 본 작업에서 재검증하지 않았으므로 둘 다 사실로 단정하지 않는다. 2026년 현금 capex $140M~$170M과 스타트업 비용 $25M~$30M 역시 콜 발언·이전 기존 기록에만 있는 기초 원자료 미대조 값이다.","분기별 스타트업 비용은 2025-Q2 0.357, Q3 0.964, Q4 1.704, 2026-Q1 7.074(이상 기존 기록·독립 재검증 없음), 2026-Q2 4.859(분기 공시 확인)이며 누적 합계는 14.958이다. Q1 대비 Q2 감소만으로 이후 비용 방향을 정할 수 없어 실제 생산 시작 시점과 추가 비용을 함께 확인한다. Q2 영업현금흐름은 61.8, 잉여현금흐름은 52.6으로 차이는 9.2다. 설비투자와의 대응은 잉여현금흐름의 정의·조정내역을 확인해야 하므로 이 차이를 확정 설비투자액이나 하반기 투자 집중의 근거로 사용하지 않는다.","Q3 분기 공시에서는 공장 비용, 실제 설비투자와 회사의 현금흐름 조정표, 그리고 4분기 후반 생산 시작 일정의 유지 여부를 확인한다. 생산 전 비용이 수익성에 미치는 영향은 손익계산서의 반영 계정과 non-GAAP 조정 여부를 구분해 살펴본다."],"source_ids":["FORM_Q2_10Q","FORM_Q2_RELEASE","FORM_Q2_SUPPLEMENT","PCARD_C01_SNAPSHOT","USER_ATTACHMENT_REF"],"table":{"columns":["항목","값","단위","구분 / 출처"],"rows":[["Farmers Branch 생산 시작","2026년 4분기 후반","일정","verified(회사 공시·발표 요약)"],["램프 목표","2027년에 걸쳐 초기 목표 수준","일정","verified; 2028은 미검증"],["Q2 공장 스타트업 비용",4.859,"USD_M","회사 발표(10-Q)"],["Q1 공장 스타트업 비용",7.074,"USD_M","기존 기록·독립 재검증 없음"],["누적 스타트업 비용(2025-Q2~2026-Q2)",14.958,"USD_M","계산값(이전 4개 분기 + 검증 Q2)"],["Q2 영업현금흐름",61.8,"USD_M","회사 발표"],["Q2 잉여현금흐름",52.6,"USD_M","회사 발표"],["OCF−FCF",9.2,"USD_M","두 보고 현금흐름의 차이·확정 설비투자액으로 해석하지 않음"],["2026 현금 capex","140~170","USD_M","기초 원자료 미대조(콜 발언·이전)"],["2026 스타트업 비용","25~30","USD_M","기초 원자료 미대조(콜 발언·이전)"],["TSIF 보조금",24.2,"USD_M","기존 기록·독립 재검증 없음(미재검증)"]]},"chart":{"kind":"bar","title":"분기별 공장 스타트업 비용(USD_M; 2026-Q2만 10-Q 검증, 이전 분기는 기존 기록·독립 재검증 없음)","labels":["2025-Q2","2025-Q3","2025-Q4","2026-Q1","2026-Q2","2026-Q3"],"series":[{"name":"공장 스타트업 비용","values":[0.357,0.964,1.704,7.074,4.859,null],"unit":"USD_M"}],"source_ids":["PCARD_C01_SNAPSHOT","FORM_Q2_10Q"]}},{"id":"s08_teradyne_keystone","title":"Teradyne 전략적 지분투자와 Keystone Microtech 파트너십","body":["2026-10-13 제출된 8-K에 따르면 FormFactor는 2026-10-06 Teradyne과 계약을 체결하고 10-12 발표했으며, Teradyne이 신주 2,234,887주를 $300M에 인수하는 전략적 지분투자다. 이를 나누면 주당 약 $134.23(파생)이다. 클로징은 통상적 조건과 규제 승인을 전제로 2026년 4분기에 예상된다. 이 거래는 Q3 분기(9/26 종료) 이후의 사건이므로 이번 신주 발행에 따른 주식수 증가와 현금 유입은 Q3에 반영하지 않으며, 실제 종결 시점에 연결된다. 확인 자료에서 구체적인 상업 협업 조건은 확보하지 못했으므로 제품·판매 협력의 내용은 미확인로 두고 10/28 콜에서의 설명을 기다린다.","2026-07-28 발표된 대만 Keystone Microtech와의 전략적 파트너십은 Keystone이 설계·조립·테스트·수리·유통 역량을 제공하고 FormFactor는 프로브 기술 개발·제조와 각자의 지식재산을 유지하는 구조다. 대만 파운드리·로직 고객에 가까운 조립·수리 거점은 Foundry\u0026Logic 세그먼트의 대응 속도와 서비스 캐파를 높이는 방향이지만, 매출 기여 시점과 규모는 공시되지 않아 미확인이다. Q3 가이드는 이 파트너십 발표 다음 날 제시됐으므로 회사가 이를 인지한 상태의 가이드라는 점만 확인된다.","Triton CPO 테스트 시스템은 Advantest·Tokyo Electron과 공동 개발한 제품이고 10월 Teradyne 계약은 별개의 전략적 지분투자다. 제품 개발 협력과 이후 지분투자를 구분해 살펴본다."],"source_ids":["FORM_TER_8K","FORM_KEYSTONE","FORM_TRITON"],"table":{"columns":["이벤트","일자","핵심 수치·내용","Q3 FY26 손익 영향","출처"],"rows":[["Teradyne 전략적 지분투자 계약","2026-10-06(계약) / 10-12(발표) / 10-13(8-K)","신주 2,234,887주, $300M(USD_M 300)","신주·현금 반영 없음(종결 이후 반영)","FORM_TER_8K"],["동 거래 주당 가액(계산값)",null,"약 $134.23 = 300,000,000 ÷ 2,234,887",null,"FORM_TER_8K 기반 파생"],["동 거래 클로징","2026년 4분기 예상","통상적 조건·규제 승인 전제","Q4 이후 주식수·현금 반영","FORM_TER_8K"],["Teradyne 상업 협업 조건",null,"구체 조건 미확인",null,"FORM_TER_8K"],["Keystone Microtech 파트너십","2026-07-28","Keystone: 설계·조립·테스트·수리·유통 / FormFactor: 프로브 기술 개발·제조·IP 유지","매출 기여 시점·규모 미공시","FORM_KEYSTONE"],["Triton CPO 테스트 시스템","2026-03-20(제품 자료)","Advantest·Tokyo Electron 공동 개발, 광·전기 테스트+웨이퍼 핸들링","Systems 성장 주동력(Q2 검증)","FORM_TRITON"]]},"chart":null},{"id":"s09_peers","title":"동종사 비교: 제품 구성과 가이던스 기준의 차이","body":["FormFactor의 분석은 DRAM·Flash·Foundry\u0026Logic 프로브카드와 Systems를 구분해 읽는다. MJC와 JEM의 메모리 프로브카드 흐름을 교차 확인하되, 각 회사의 제품 구성과 회계연도·단위가 다르므로 같은 수치처럼 합산하거나 통화를 환산하지 않는다. 각 회사의 최신 실적·재고·증설 근거는 해당 회사 프리뷰에서 따로 살펴본다.","가이던스의 형태도 다르다. FormFactor는 회사가 직접 제시한 분기 매출 범위를 사용한다. 기존 비교 기록의 MJC·JEM 수치는 누적 가이드에서 이미 발표된 실적을 뺀 계산값이어서 회사의 직접 분기 가이드와 구분해야 한다. 오래된 반올림 비교값을 최신값처럼 재사용하지 않고, 각 회사 탭에서 공식 자료의 기간·단위·계산식을 확인한다."],"source_ids":["PCARD_C01_SNAPSHOT","FORM_Q2_RELEASE"],"table":{"columns":["회사","실적을 읽는 기준","분기 전망 구분"],"rows":[["FormFactor","프로브카드 제품군과 Systems를 분리·미 달러 기준","회사 직접 분기 가이드"],["Micronics Japan(MJC)","메모리 프로브카드 흐름·일본 엔 기준","누적 가이드 차분은 계산값으로 구분·회사 탭의 원자료 확인"],["Japan Electronic Materials(JEM)","3월 결산 회계기간과 역년 분기를 구분·일본 엔 기준","반기 가이드 차분은 계산값으로 구분·회사 탭의 원자료 확인"]]},"chart":null},{"id":"s10_watchpoints","title":"10/28 Q3 발표 체크리스트와 분기별 향후 관전 포인트","body":["Q3 실적은 2026-10-28 미국 장 마감 후 발표되고 컨퍼런스콜은 13:25 PT(한국시간 10-29 05:25)에 열린다. 매출은 회사 가이드 260~280 범위와 비교하되 첨부 기준일의 컨센서스 비교값을 재현하지 못해 시장 기대 대비 판정은 보류한다. 별도로 확인한 Finviz 조회 이력은 컨센서스 출처 비교에 표시한다. 마진은 총이익률 54% 자체뿐 아니라 실제 관세 환급 인식액·계정과 다른 조정항목을 대조한다. 제품별 매출은 DRAM·Foundry\u0026Logic·Systems의 변화와 HBM 기여 설명을, 재고는 완제품·재공품과 매출의 움직임을 함께 확인한다. 컨센서스와 무역 출처는 갱신 때마다 새 조회 시각이 찍힌 출처 세트를 다시 받아 같은 정의로 재계산하고, 미지 항목은 null로 두며 이전 결과는 수정하지 않는다.","Q3 이후의 관전 포인트는 분기별로 갱신된다. 2026-Q4에는 Farmers Branch 생산 시작(4분기 후반)과 Teradyne 거래 클로징(Q4 예상), 그리고 10/28에 제시될 Q4 가이던스가 다음 프리뷰의 베이스라인이 된다. 2027년에는 신공장 램프에 따른 스타트업 비용과 마진 경로, Keystone 파트너십의 Foundry\u0026Logic 기여, CPO 테스트 시스템의 Systems 기여 지속성이 주제가 된다. 각 항목은 검증 실적이 나올 때마다 이전 프리뷰를 동결한 채 새 대상 분기로 이월하며, 새 가이드가 없으면 판단 보류로 둔다."],"source_ids":["FORM_Q3_DATE","FORM_Q2_RELEASE","FORM_Q2_10Q","FORM_TER_8K","FORM_KEYSTONE","FORM_Q2_SUPPLEMENT","FINVIZ_FORM_EARNINGS_20261019","ESTAT_HS903090000_EXPORT_2023_2026","SEC_COMPANYFACTS_FORM"],"table":{"columns":["관전 포인트","2026-Q2 기준값(출처 구분 참조)","2026-Q3 가이드/회사 예상","판단 기준","비고"],"rows":[["매출(USD_M)",258.242,"260~280(중값 270)","가이드 범위 내 위치","컨센서스 미검증 → 비트/미스 판정 없음(Finviz 10-19 조회값은 참고 관측)"],["non-GAAP 총이익률(%)",53.3,"52.5~55.5(중값 54.0)","회사 가이드 대비 위치·환급과 기타 조정항목 확인","수령액만으로 정상화 마진 산출하지 않음"],["관세 환급(USD_M)",0.8,"7~9","실제 인식액과 반영 계정","현금 수령액과 손익 인식액·시점 구분"],["non-GAAP EPS(USD)",0.82,"0.77~0.95(중값 0.86)","GAAP 격차(가이드 0.11)","Q2 GAAP 희석 EPS 0.71·조정항목 대조"],["DRAM 세그먼트(USD_M)",84.999,null,"레벨 변화, HBM 기여 재공시","콜 발언 'DRAM 보합'은 기초 원자료 미대조"],["Foundry\u0026Logic 세그먼트(USD_M)",121.839,null,"성장 지속 여부",null],["Systems 세그먼트(USD_M)",48.547,null,"48.5 레벨 유지 여부(분기별 변동성)","Triton CPO 언급"],["재고 합계(USD_M)",121.409,null,"완제품 vs 재공품 상대 변화",null],["공장 스타트업 비용(USD_M)",4.859,null,"Q3 10-Q 라인","가동 전 분기 증가 가능"],["Q4 가이던스",null,null,"제시 시 다음 대상 분기 베이스라인; 미제시 시 판단 보류","구 가이드 이월 금지"],["Teradyne 클로징",null,"2026년 4분기","규제 승인·조건 충족","신주·현금은 실제 종결 시점에 반영"],["컨센서스 출처 재조회",null,"Finviz 2026-10-19 조회 참고: Q3 270.5163(9명) · Q4 278.3594(수정일 미제공)","다음 갱신 시 새 조회 시각이 찍힌 출처 세트를 다시 수집해 비교","10-19 관측치를 다음 분기 값으로 이월 금지; 원 스냅샷 검증 전 컨센서스 null"],["무역지표 매칭 창 재계산","고정 12쌍 r 0.790 / 0.809(전국 엔화)",null,"Q3 실적 확인 후 동일 정의의 최신 완료 12쌍(2023-Q4~2026-Q3)을 새 조회 자료로 재계산; 7~8월·4~6월 창은 이미 확보","기존 12쌍 결과는 이력 보존·수정 금지; 예측 근거 아님"]]},"chart":null},{"id":"s11_limitations","title":"출처 한계·불일치·미검증 참조값(컨센서스·상관계수·콜 발언)","body":["사용자가 제공한 8장 이미지는 원문 전체이며 이미지 안의 수치와 설명을 확인했다. 아래 미검증 표시는 첨부 원문을 못 봤다는 뜻이 아니라, 원문이 인용한 집계 제공사·기초 시계열·회사 콜 원자료와의 대조가 끝나지 않았다는 뜻이다. 자료는 공식 발표·공시에서 확인한 내용, 이전에 수집한 기록, 사용자 첨부 참고로 구분한다. 2025-Q2·2026-Q1·Q2의 제품별 매출 12개 값과 Q2 희석 EPS는 공식 자료에서 대조했다. 차트의 다른 과거 분기와 일부 무역통계에는 독립 재검증하지 않은 값이 포함되어 있어 이를 표시했다. 원출처 추적이 충분하지 않은 영업이익·무역지표 성능 수치는 판단 근거에서 제외했다.","확인 수준이 다른 항목을 함께 적는다. HBM의 검증 내용은 DRAM 전년 대비 증가분의 약 75%라는 설명이고, 첨부의 DRAM 매출 중 약 2/3라는 비중과는 지표가 다르다. 첨부의 Q2 정상화 non-GAAP 총이익률 약 51%는 회사 콜 원자료와 전체 조정항목을 확인하지 못했다. 관세 환급 수령액 0.8만으로 정상화 마진을 계산하거나 이 수치와 불일치한다고 판단하지 않는다. 신공장 검증 일정은 4분기 후반 생산 시작·2027년 확대까지이며 2028년 초 초기 생산능력 도달·마진 기여는 회사 콜 원자료와의 대조가 남아 있다.","첨부의 Q3·Q4 컨센서스 270.469·277.522 USD_M(2026-10-15 기준)은 제공사의 기초 집계자료와 제공사명이 없어 여전히 미검증 참조값이다. 2026-10-19 조회한 Finviz 이력에서 10-02 행 270.4686이 반올림으로 일치하고 10-15 행은 270.5163, Q4 현재 표시값은 278.3594(수정일 미제공)였으나, 이는 다른 출처의 현재 조회 이력이며 원 스냅샷의 검증이 아니다. 동행 상관 0.79(10/12)·선행 상관 0.89(11/12)·8월 일본 수출 122.8 USD_M(+3.9%)도 첨부 원문에 기초 수출 시계열·HS 매핑·환율·관측 시점·방향 산식이 없어 재현하지 못했다. 전국 HS903090000 엔화 계열로 새로 계산한 r 0.790 / 0.809(부호 9/12 · 10/12)는 바스켓을 명시한 별도 대체 계산이며 원 계수를 대체하거나 검증했다고 주장하지 않는다. 이전 자료의 2030 매출모델, TSIF 보조금, 연간 설비투자·스타트업 비용 계획도 재검증 전 참고로 구분한다."],"source_ids":["USER_ATTACHMENT_REF","PCARD_C01_SNAPSHOT","FORM_Q2_RELEASE","FORM_Q2_10Q","FORM_Q2_SUPPLEMENT","FORM_Q1_10Q","FINVIZ_FORM_EARNINGS_20261019","ESTAT_HS903090000_EXPORT_2023_2026","SEC_COMPANYFACTS_FORM"],"table":{"columns":["항목","값(참조)","상태","본 프리뷰 처리"],"rows":[["Q3 컨센서스 매출(USD_M · 첨부 원 주장)",270.469,"첨부 원문 확인 · 제공사 기초 집계자료·제공사명 미확인 · 첨부 기준일 2026-10-15","첨부 기준  수준(27.0%)에 가까운 하락을 내포한다. 메모리 95% 집중(HBM 비중 비공개), 수주·수주잔고 수치 공표 종료, 원재료·재공품 중심 재고 증가, 연간 설비투자 21,000백만엔과 회사가 제시한 하반기 계획 12,074백만엔(연간−상반기 산술값 12,075와 1 차이)이 11월 12일 발표의 핵심 확인 항목이다.","sections":[{"id":"s01_baseline","title":"조건부 베이스라인: Q2 기록 실적에서 9M 가이드 차감 Q3 기준점으로","body":["[관측] FY2026 Q2(역년 2026-Q2, 2026-04-01~06-30)는 결산 보충자료의 직접 분기표 기준 매출 28,261백만엔, 영업이익 9,909백만엔으로 전년동기 대비 각각 +48.8%, +110.3%, 전분기 대비 +34.9%, +75.4%였다. 상반기 누적(2026-01-01~06-30)은 매출 49,206백만엔, 영업이익 15,557백만엔, 경상이익 16,260백만엔, 순이익 11,461백만엔이다. 동사는 12월 결산이므로 회계 분기와 역년 분기가 일치하지만, 11월 12일 Q3 발표는 1~9월 누적 기준이므로 단일 분기 값은 보충자료의 분기표 또는 누적 차감으로 따로 확인해야 한다.","[회사 가이드] 2026-08-12 수정 공시에서 회사는 9개월 누적 매출 74,200백만엔·영업이익 22,400백만엔·경상이익 23,100백만엔·순이익 16,300백만엔, 연간 매출 103,800백만엔·영업이익 31,400백만엔·경상이익 32,000백만엔·순이익 23,000백만엔을 제시했다. 2026-05-13 9개월 가이드(매출 71,600·영업이익 21,900·경상이익 21,400·순이익 15,200) 대비 매출 +2,600, 영업이익 +500, 경상이익 +1,700, 순이익 +1,100이며, 영업이익보다 경상이익 상향폭이 큰 점은 영업외 항목 가정 변화를 시사하나 회사가 내역을 수치로 분해하지는 않았다. [산술] Q3 기준점은 74,200 − 49,206 = 24,994백만엔(매출), 22,400 − 15,557 = 6,843백만엔(영업이익), 영업이익률 27.4%이다. 이는 회사의 단일 분기 가이던스가 아니라 누적 가이드와 실적의 차이이며 범위가 없다.","[해석] 파생 Q3 매출 24,994는 Q2 대비 −11.6%이지만 2025-Q3(17,291) 대비 +44.5%이다. 직접 분기표에서 2024년(Q2 14,376 → Q3 12,812, −10.9%)과 2025년(Q2 18,996 → Q3 17,291, −9.0%) 모두 Q3 매출이 Q2를 밑돌았고, 이번에는 회사 스스로 Q2에 출하 앞당김가 포함됐다고 설명했으므로 Q3가 Q2보다 낮게 나오는 것 자체는 가이드에 이미 내재된 경로다. 관건은 24,994 대비 위치와 9개월·연간 가이드의 재수정 여부다. 아울러 연간 가이드에서 9개월 가이드를 뺀 Q4 산술값 29,600백만엔은 Q2 기록(28,261)을 웃도는 수준으로, 회사 연간 가이드는 Q3 조정 후 Q4 재가속을 전제한다. 이 값은 두 가이드의 차이일 뿐 회사가 명시한 분기 계획이 아니다."],"source_ids":["MJC_Q2_SUP","MJC_Q2_RESULTS","MJC_GUIDE","MJC_CALENDAR"],"table":{"columns":["구분","기간","매출(JPY백만)","영업이익(JPY백만)","영업이익률(%, 산술)","근거 유형"],"rows":[["FY2026 Q1 (2026-Q1)","2026-01-01~03-31",20945,5647,27.0,"관측: 직접 분기표"],["FY2026 Q2 (2026-Q2)","2026-04-01~06-30",28261,9909,35.1,"관측: 직접 분기표"],["FY2026 H1 누적","2026-01-01~06-30",49206,15557,31.6,"관측: 결산단신"],["FY2026 9M 누적 가이드(2026-08-12)","2026-01-01~09-30",74200,22400,30.2,"회사 가이드"],["FY2026 Q3 (2026-Q3) 파생 기준점","2026-07-01~09-30",24994,6843,27.4,"산술: 9M 가이드 − H1 실적"],["FY2026 연간 가이드(2026-08-12)","2026-01-01~12-31",103800,31400,30.3,"회사 가이드"],["FY2026 Q4 (2026-Q4) 가이드 차이","2026-10-01~12-31",29600,9000,30.4,"산술: 연간 가이드 − 9M 가이드"]]},"chart":{"kind":"bar","title":"분기 매출: 직접 분기표 실적(2024-Q2~2026-Q2)과 2026-Q3 파생 기준점 (JPY백만)","labels":["2024-Q2","2024-Q3","2024-Q4","2025-Q1","2025-Q2","2025-Q3","2025-Q4","2026-Q1","2026-Q2","2026-Q3"],"series":[{"name":"매출 실적(직접 분기표)","values":[14376,12812,16659,14124,18996,17291,19761,20945,28261,null],"unit":"JPY_M"},{"name":"매출 파생 기준점(9M 가이드 − H1 실적)","values":[null,null,null,null,null,null,null,null,null,24994],"unit":"JPY_M"}],"source_ids":["MJC_Q2_SUP","MJC_GUIDE","MJC_Q2_RESULTS"]}},{"id":"s02_memory_mix","title":"메모리 95% 집중과 비메모리 5%: HBM 비중은 비공개, 제품 플랫폼별 역할","body":["[관측] Q2 프로브카드(PC) 세그먼트 매출 27,912백만엔 중 메모리향 26,465백만엔(95%), 비메모리향 1,447백만엔(5%)이다. 회사는 'HBM 주도의 DRAM 수요가 견조'하고 '고부가 DRAM이 세그먼트 이익을 지지'했다고 설명했지만, HBM 매출·이익 비중은 수치로 공개하지 않았다. 따라서 95%는 메모리 용도 비중이지 HBM 비중이 아니며, 본 프리뷰는 HBM 기여를 숫자로 추정하지 않는다. [관측] 직접 분기표의 테스트장비(TE) 세그먼트 매출은 348백만엔이다. PC와 TE의 표시값 합계 28,260은 연결 매출 28,261보다 1백만엔 작다. 이 차액을 TE 매출에 더하지 않는다.","[관측] 제품 플랫폼은 역할이 구분된다. U-Probe는 MEMS 마이크로캔틸레버·박막 다층 구조로 DRAM·플래시 웨이퍼 프로빙에, SP-Probe는 수직 스프링핀 방식으로 12인치 NAND에, MEMS-SP는 플립칩 로직·SoC에, MEMS-V는 협피치·고핀수 로직용 수직 MEMS 프로브카드에 대응한다. 차세대 HBM 대응 기술과 고성능 로직용 수직 프로브카드는 개발·고객 확대 단계의 주제로 제시될 뿐 별도 매출로 계량되지 않는다. 메모리 매출 비중과 고부가 DRAM의 이익 기여 설명은 현재 사업 구조를 보여 주지만, 메모리·비메모리별 이익 금액은 공개되지 않았다. 로직용 제품은 신규 고객 확보와 연구개발을 추진하고 있다.","[해석] 11월 12일에는 비메모리 매출 1,447백만엔과 비중 5%의 변화를 함께 확인한다. 비중은 메모리 매출의 분기 변동만으로도 달라지므로 절대 금액과 회사의 신규 고객·제품 설명을 우선 본다. 비메모리 매출의 증가나 감소만으로 고객 인증의 성과 또는 출하 시점의 영향을 구분할 수는 없다."],"source_ids":["MJC_Q2_SUP","MJC_Q2_DECK"],"table":{"columns":["항목","Q2 값(JPY백만)","비중(%)","비고"],"rows":[["PC 세그먼트 매출",27912,100,"관측: 보충자료"],["  메모리향",26465,95,"관측: 용도 비중, HBM 비중 아님"],["  비메모리향",1447,5,"관측: 로직·SoC 등"],["TE 세그먼트 매출",348,null,"관측: 직접 분기표; PC+TE 표시값 합계는 연결보다 1 작음"],["HBM 매출·이익 비중",null,null,"비공개"]]},"chart":null},{"id":"s03_demand_orders","title":"출하 앞당김 설명과 수주·수주잔고 수치 공표 종료: Q3 수요 판단의 근거 범위","body":["[관측] 회사는 Q2 PC 기록 매출의 배경을 '전분기에서 이월된 출하 및 생산능력 증강에 따른 매출 앞당김'으로 설명했다. 수주에 대해서는 '크게 증가'라는 정성 표현만 있고 분기 수주 수치는 없다. [관측] FY2025 결산 설명회 자료에서 회사는 수주고·수주잔고 정보 공표를 2025년도로 종료한다고 밝혔고, 실제로 FY2026 Q1·Q2 자료에는 수치 수주·잔고가 없다. 본 프리뷰는 FY2025 시점의 잔고를 FY2026 증거로 이월하지 않는다.","[해석] 수치 수주가 사라진 상태에서 Q3 수요 강도는 (a) 회사의 정성 코멘트, (b) 재고 구성(4절), (c) 설비투자 집행(6절)으로 간접 확인할 수밖에 없다. 이 세 가지는 모두 '수요'와 '출하 타이밍'을 구분하지 못한다. Q2가 전분기에서 넘어온 출하를 포함했다면 Q3 매출은 동일한 수요 수준에서도 낮게 나올 수 있고, 반대로 Q2의 증산 효과가 Q3에도 이어지면 24,994를 웃돌 수 있다. 회사가 Q3 발표에서 '출하 이월'과 '증산' 중 어느 쪽을 강조하는지가 Q4 산술값 29,600의 현실성을 가늠하는 단서다.","[관측] TE 세그먼트는 테스트 소켓 매출이 증가했으나 세그먼트 손실이 지속됐고(Q2 −475백만엔), Testalio 테스터와 Excelyze 엔지니어링 프로버는 고객 평가 단계로 수주 확정 전이다. [해석] 고객 인증이 수주로 전환되는 시점은 공개되지 않았으므로 Q3 TE 손실 축소 여부는 연결 영업이익의 보조 변수로만 취급한다."],"source_ids":["MJC_Q2_SUP","MJC_FY25_DECK","MJC_Q2_DECK"],"table":{"columns":["공개 항목","FY2025까지","FY2026 Q1·Q2","Q3 프리뷰 취급"],"rows":[["분기 수주고(수치)","공표","공표 종료","미공개·추정하지 않음"],["수주잔고(수치)","공표","공표 종료","미공개·FY2025 값을 현재 값으로 사용하지 않음"],["수주 동향(정성)","공표","'크게 증가'","관측 코멘트로만 인용"],["Q2 매출 배경 설명","-","전분기 출하 이월 + 증산에 따른 매출 앞당김","Q3 하락 경로의 회사 측 근거"],["TE 신제품 고객 평가","-","Testalio·Excelyze 평가 중","수주 전, 수치 없음"]]},"chart":null},{"id":"s04_inventory_cash","title":"재고 구성·현금흐름·설비투자 지출: 원재료 중심 증가와 매출 증가율의 격차","body":["[관측] 재고자산은 2025-12-31 13,190 → 2026-03-31 14,203 → 2026-06-30 15,457백만엔이다. 구성은 제품 913/1,097/1,139, 재공품 8,248/9,125/9,359, 원재료·저장품 4,028/3,980/4,959백만엔이다. [산술] Q2 재고 증가율은 +8.8% QoQ로 매출 +34.9%보다 훨씬 느리다. Q2 증가분 1,254백만엔 중 원재료·저장품 +979, 재공품 +234, 제품 +42로 원재료 비중이 압도적이다(구성별 증가 합 1,255와 보고 총액 증가 1,254의 차이 1은 그대로 표시). 12월과 3월 말의 구성 합(13,189·14,202)은 보고 총액보다 각 1백만엔 작으며 6월 말은 일치한다.","[관측] 상반기 영업활동 현금흐름 12,165백만엔, 투자활동 현금흐름 −7,505백만엔, 유형자산 취득 지출 7,651백만엔, 재고 증가에 따른 현금 흡수 2,475백만엔, 기말 현금성자산 17,950백만엔이다. [산술] 영업CF와 투자CF의 합은 4,660백만엔이다. 회사가 보고한 상반기 설비투자액 8,925백만엔(건설가계정 포함)과 현금 지출 7,651백만엔은 기준이 다르므로 혼용하지 않는다.","[해석] 재고가 매출보다 느리게 늘고 원재료·재공품 중심이라는 점은 생산 준비와 일관되지만, 그 자체가 Q3 매출을 증명하지는 않는다. 제품 재고는 1,139백만엔으로 Q2 매출의 약 4.0%다. 11월 12일에는 원재료·재공품·제품의 변화와 실제 출하를 함께 확인한다. 제품 재고가 늘어도 출하 지연뿐 아니라 생산 일정·제품 구성의 영향이 가능하므로 재고 증가만으로 원인을 단정하지 않는다."],"source_ids":["MJC_Q2_SUP","MJC_Q1_RESULTS","MJC_Q2_RESULTS"],"table":{"columns":["항목(FY2026 H1, 2026-01-01~06-30)","값(JPY백만)","근거 유형"],"rows":[["영업활동 현금흐름",12165,"관측: 결산단신"],["투자활동 현금흐름",-7505,"관측: 결산단신"],["영업CF + 투자CF",4660,"산술"],["유형자산 취득 지출",7651,"관측: 현금흐름표"],["설비투자액(건설가계정 포함)",8925,"관측: 보충자료, 현금 지출과 기준 상이"],["재고 증가에 따른 현금 흡수",2475,"관측: 현금흐름표"],["기말 현금 및 현금성자산",17950,"관측: 결산단신"]]},"chart":{"kind":"stack","title":"재고자산 구성 추이 (JPY백만, 구성 합은 12월·3월 말 보고 총액보다 각 1 작음)","labels":["2025-12-31","2026-03-31","2026-06-30"],"series":[{"name":"제품","values":[913,1097,1139],"unit":"JPY_M"},{"name":"재공품","values":[8248,9125,9359],"unit":"JPY_M"},{"name":"원재료 및 저장품","values":[4028,3980,4959],"unit":"JPY_M"}],"source_ids":["MJC_Q2_SUP","MJC_Q1_RESULTS","MJC_Q2_RESULTS"]}},{"id":"s05_margins","title":"마진 구조: Q2 35.1% 영업이익률과 파생 Q3 27.4%의 간격, 세그먼트·영업외 분리","body":["[산술] Q2 매출총이익률은 53.8%(15,217/28,261)로 Q1 47.3%에서 6.6pt 상승했고, 영업이익률은 35.1%로 Q1 27.0%에서 8.1pt 상승했다. 직접 분기표 기준 영업이익률은 2024-Q2 22.6%, 2025-Q2 24.8%, 2025-Q4 26.5%로 추이했으므로 Q2의 35.1%는 뚜렷한 이례치다. [관측] Q2 PC 세그먼트 이익 11,472백만엔, TE 세그먼트 −475백만엔이며, [산술] 연결 영업이익 9,909와의 차이 −1,088백만엔이 전사 조정액이다. PC 세그먼트 마진은 41.1%(11,472/27,912)다.","[산술] 파생 Q3 영업이익률 27.4%(6,843/24,994)는 Q1의 27.0%와 가깝고 Q2 대비 −7.7%p다. [해석] 누적 가이드의 차감값은 Q2보다 낮은 매출과 영업이익률을 내포한다. 다만 영업이익률만으로 물량 증가에 따른 고정비 부담 완화와 고부가 DRAM 구성 효과를 나눌 수는 없다. Q3 제품별 매출, 세그먼트 이익과 회사의 비용·제품 구성 설명을 함께 대조해야 하며, 근거가 없는 정상화 마진이나 임의의 판정 기준은 산출하지 않는다.","[관측] 상반기 환차익 693백만엔은 영업외수익, 보조금 수입 1,000백만엔은 특별이익에 포함됐다. 따라서 환차익은 경상이익에, 특별이익 보조금은 경상이익 이후의 세전이익에 반영되며 둘 다 영업이익과 구분된다. 같은 상반기 현금흐름표의 보조금 수령액은 400백만엔으로 투자활동 현금흐름에 표시되어 있어 손익 금액 1,000과 혼용하지 않는다. [산술] Q3 파생 경상이익은 23,100 − 16,260 = 6,840백만엔으로 파생 영업이익 6,843과 3백만엔 차이다. 이는 누적 표시값의 차감 결과이며 개별 영업외 항목을 회사가 0으로 가정했다는 뜻은 아니다. 실제 실적에서는 영업손익, 영업외손익, 특별손익·세금, 기타포괄손익을 각각 확인한다."],"source_ids":["MJC_Q2_SUP","MJC_Q2_RESULTS","MJC_GUIDE"],"table":{"columns":["항목","2026-Q1","2026-Q2","2026-Q3 파생 기준점","근거 유형"],"rows":[["매출(JPY백만)",20945,28261,24994,"관측 / 관측 / 산술"],["매출총이익률(%)",47.3,53.8,null,"산술(총이익/매출)"],["영업이익(JPY백만)",5647,9909,6843,"관측 / 관측 / 산술"],["영업이익률(%)",27.0,35.1,27.4,"산술"],["PC 세그먼트 이익(JPY백만)",null,11472,null,"관측(Q2 직접 분기값)"],["TE 세그먼트 이익(JPY백만)",null,-475,null,"관측(Q2 직접 분기값)"],["전사 조정(JPY백만)",null,-1088,null,"산술: 9,909 − 11,472 + 475"],["경상이익(JPY백만)",null,10268,6840,"관측 / 산술(23,100 − 16,260)"]]},"chart":{"kind":"bar","title":"분기 영업이익: 직접 분기표 실적(2024-Q2~2026-Q2)과 2026-Q3 파생 기준점 (JPY백만)","labels":["2024-Q2","2024-Q3","2024-Q4","2025-Q1","2025-Q2","2025-Q3","2025-Q4","2026-Q1","2026-Q2","2026-Q3"],"series":[{"name":"영업이익 실적(직접 분기표)","values":[3255,2878,3928,2857,4711,3730,5241,5647,9909,null],"unit":"JPY_M"},{"name":"영업이익 파생 기준점(9M 가이드 − H1 실적)","values":[null,null,null,null,null,null,null,null,null,6843],"unit":"JPY_M"}],"source_ids":["MJC_Q2_SUP","MJC_GUIDE","MJC_Q2_RESULTS"]}},{"id":"s06_capacity","title":"생산능력의 세 층위: 가동 중인 아오모리 증강, 2027~28년 24,100백만엔 투자, 오이타 토지 확보","body":["[관측] FY2026 연간 계획은 설비투자 21,000백만엔, 연구개발 8,900백만엔, 감가상각 9,400백만엔이다. 상반기 실적은 설비투자 8,925백만엔(Q1 4,568·Q2 4,356의 표시값 합 8,924와 1 차이), 연구개발 3,906백만엔, 감가상각 3,598백만엔이다. 회사 보충자료의 하반기 설비투자 계획은 12,074백만엔이다. [산술] 연간 계획에서 상반기 실적을 뺀 값은 21,000 − 8,925 = 12,075백만엔으로 회사 하반기 표시값보다 1 크다. 두 값을 각각 보존하며 분기 배분은 공개되지 않아 Q3·Q4로 나누지 않는다. 감가상각의 같은 방식 차감값은 5,802백만엔(9,400 − 3,598)으로, 연간 계획은 하반기 금액이 상반기보다 커지는 경로를 내포한다.","[관측] 2026-03-26 공시: 아오모리 공장과 아오모리 마쓰자키 공장의 생산능력 증강에 24,100백만엔을 투자하며, 투자 기간은 2027~2028년, 재원은 자기자금과 차입, FY2026 실적 영향은 없다고 밝혔다. 가동 개시 분기는 공개되지 않았다. [관측] 2026-07-31 공시: 오이타 기술연구소 인접 토지(북측 20,289㎡, 서측 8,385㎡; 기존 연구소 부지 17,047㎡)를 자기자금으로 취득하며, 현재 용도는 주차장이고 목적은 장래 프로브카드 성장 대비, FY2026 실적 영향 없음, 신공장 착공일은 공시하지 않았다. [산술] 취득 면적 합 28,674㎡는 기존 부지의 약 1.7배다.","[해석] 현재 생산능력을 판단할 때는 회사가 Q2 매출을 앞당긴 배경으로 설명한 기존 아오모리 설비 증강을 우선 본다. 2027~28년 투자와 오이타 토지는 미래 생산능력을 위한 항목이며, 가동 시점이 공개되지 않아 Q3·Q4 생산량으로 환산하지 않는다. 한국 거점을 포함한 해외 생산능력과 고객 인증 일정은 인용 문서에 수치·일정이 없어 기재하지 않으며, 11월 12일 자료에서 신규 공개 여부를 확인한다."],"source_ids":["MJC_Q2_SUP","MJC_CAPEX","MJC_LAND","MJC_Q2_DECK"],"table":{"columns":["층위","내용","금액(JPY백만)","시기","FY2026 실적 영향(회사 설명)","Q3 프리뷰 취급"],"rows":[["1. 가동 중 증강","FY2026 설비투자 계획(기존 아오모리 설비 포함)",21000,"2026-01~12 (H1 집행 8,925)","매출 앞당김의 배경으로 언급","현재 생산능력 판단의 확인 항목"],["2. 차기 투자","아오모리 공장·마쓰자키 공장 증강",24100,"2027~2028 (가동 분기 미공개)","없음","Q3 추정에 미반영"],["3. 토지 옵션","오이타 기술연구소 인접 토지 28,674㎡",null,"2026-07-31 취득 공시, 착공 일정 미공개","없음","Q3 추정에 미반영"]]},"chart":{"kind":"bar","title":"FY2026 설비투자·연구개발·감가상각: 상반기 실적 vs 연간 계획 (JPY백만)","labels":["설비투자","연구개발","감가상각"],"series":[{"name":"FY2026 H1 실적(2026-01~06)","values":[8925,3906,3598],"unit":"JPY_M"},{"name":"FY2026 연간 계획(2026-01~12)","values":[21000,8900,9400],"unit":"JPY_M"}],"source_ids":["MJC_Q2_SUP"]}},{"id":"s07_regions_balance","title":"아시아 93% 지역 집중과 투자유가증권 중심 자산 증가","body":["[관측] Q2 지역별 매출은 일본 1,347, 아시아 26,265, 미국·유럽 648백만엔이다. [산술] 아시아 비중은 92.9%이고 세 지역 합 28,260은 연결 28,261보다 1백만엔 작다. 이 수치는 회사의 판매 지역 기준이며 통관 원산지나 항만 기준이 아니다. 본 프리뷰는 무역통계를 Q3 매출 추정에 사용하지 않는다. [해석] 지역과 제품 용도는 서로 다른 분류이며 교차표가 공개되지 않아 아시아 매출을 메모리 매출 또는 특정 고객군과 동일시할 수 없다. 지역 변화는 제품별 매출과 고객 확대에 관한 설명을 함께 확인하는 보조 자료로 사용한다.","[관측] 투자유가증권은 2025-12-31 10,658백만엔에서 2026-06-30 36,397백만엔으로, 자산총계는 99,026백만엔에서 138,802백만엔으로 늘었다. [산술] 자산 증가 39,776백만엔 중 투자유가증권 증가 25,739백만엔이 약 65%를 차지한다. [관측] 별도의 상반기 포괄손익계산서에는 기타유가증권 평가차액 17,666백만엔이 기타포괄손익으로 보고됐다. 이 금액은 영업이익·경상이익·순이익에 포함된 평가이익으로 취급하지 않는다. [해석] 투자유가증권 잔액 증가 전체를 평가차액이나 생산능력 증가로 환산할 수 없으며, Q3에도 손익계산서와 기타포괄손익을 나누어 확인한다."],"source_ids":["MJC_Q2_SUP","MJC_Q2_RESULTS","MJC_Q2_DECK"],"table":{"columns":["대차대조표 항목","2025-12-31","2026-06-30","증감(산술)","근거 유형"],"rows":[["투자유가증권(JPY백만)",10658,36397,25739,"관측: 결산단신"],["자산총계(JPY백만)",99026,138802,39776,"관측: 결산단신"],["재고자산(JPY백만)",13190,15457,2267,"관측: 보충자료"],["현금 및 현금성자산 기말(JPY백만)",null,17950,null,"관측: 현금흐름표"]]},"chart":{"kind":"bar","title":"2026-Q2 지역별 매출 (JPY백만, 회사 판매 지역 기준; 합 28,260 vs 연결 28,261)","labels":["일본","아시아","미국·유럽"],"series":[{"name":"2026-Q2 지역별 매출","values":[1347,26265,648],"unit":"JPY_M"}],"source_ids":["MJC_Q2_SUP"]}},{"id":"s08_watchpoints","title":"11월 12일 FY2026 Q3 발표 체크리스트","body":["[관측] 회사 IR 캘린더는 2026년 12월기 제3사분기 결산 발표일을 2026-11-12로 안내한다(시각 미표기). 발표는 1~9월 누적 기준이므로 Q3 단일 분기 값은 누적에서 상반기를 차감하거나 보충자료 분기표로 확인해야 하며, Q2에는 두 방식의 영업이익이 1백만엔 달랐으므로 다음 발표에서도 각각의 기준을 확인한다.","[해석] 확인 순서는 다음과 같다. 첫째, 9개월 누적 매출·영업이익이 74,200·22,400 대비 어디에 있는지와 연간 가이드(103,800·31,400) 재수정 여부. 둘째, Q3 단일 분기 영업이익률이 파생 27.4% 및 Q2 35.1%와 어떻게 달라졌는지. 셋째, PC 메모리·비메모리 금액과 비중, TE 손실 폭. 넷째, 재고 구성에서 원재료의 전환 여부와 제품 재고 변화. 다섯째, 9개월 설비투자 누계가 연간 21,000 대비 어느 정도 진행됐는지. 여섯째, 영업외·특별 항목(환차손익·보조금)과 별도로 보고되는 기타포괄손익(유가증권 평가차액). 일곱째, 아오모리 2027~28 투자와 오이타 부지의 일정 신규 공개 여부. 수주·수주잔고 수치는 공표가 종료됐으므로 기대하지 않되, 정성 코멘트의 어조 변화를 기록한다."],"source_ids":["MJC_CALENDAR","MJC_GUIDE","MJC_Q2_SUP","MJC_Q2_RESULTS","MJC_CAPEX","MJC_LAND"],"table":{"columns":["순번","확인 항목","비교 기준값","기준값 성격"],"rows":[[1,"9M 누적 매출 / 영업이익(JPY백만)","74,200 / 22,400","회사 가이드(2026-08-12)"],[2,"Q3 단일 분기 매출 / 영업이익(JPY백만)","24,994 / 6,843","산술: 9M 가이드 − H1 실적"],[3,"Q3 영업이익률(%)","27.4 (파생) vs 35.1 (Q2 실적)","산술"],[4,"PC 비메모리 매출(JPY백만) / 비중(%)","1,447 / 5","관측(Q2)"],[5,"TE 세그먼트 이익(JPY백만)","-475","관측(Q2)"],[6,"재고 총액 / 원재료·저장품(JPY백만)","15,457 / 4,959","관측(2026-06-30)"],[7,"9M 설비투자 누계(JPY백만)","H1 8,925, H2 회사 계획 12,074, 연간 계획 21,000","관측 / 회사 계획"],[8,"연간 가이드 재수정 여부","103,800 / 31,400","회사 가이드(2026-08-12)"],[9,"수주·수주잔고","수치 없음","공표 종료(FY2025로 종료)"]]},"chart":null},{"id":"s09_limitations","title":"출처 한계와 수치 불일치: 직접 분기값·누적 차감·표시 기준","body":["[관측] 상반기 누적 영업이익 15,557에서 Q1 5,647을 뺀 Q2 영업이익은 9,910백만엔이지만 보충자료 직접 분기표에는 9,909백만엔으로 보고됐다. 본 프리뷰는 직접 분기값 9,909를 채택하고 차감값 9,910도 비교 기준으로 남긴다. 자료는 백만엔 미만 절사를 명시하지만 이 1백만엔 차이의 구체적 원인을 별도로 설명하지 않아 절사 때문이라고 확정하지 않는다. 매출은 49,206 − 20,945 = 28,261로 직접 분기표와 일치한다. 기존 기록의 Q2 영업이익 99.1억엔과 Q3 파생 매출 249.9억엔은 각각 이번 직접 분기값 99.09억엔과 산술값 249.94억엔보다 표시 자릿수가 적다. 기존 기록의 반올림 방식이나 원계산 기준을 확정하지 않고 이번에는 공식 백만엔 표시값과 산식을 사용한다.","[관측] 확인이 남은 항목은 다음과 같다. (1) FY2026 설비투자 중 장비 전용 190억엔이라는 기존 기록은 최신 공식 자료에서 별도 소계로 확인하지 못했다. 확인한 연간 총액은 21,000백만엔이다. (2) 설명회 자료의 2023~2026년 누적 설비투자 608억엔과 보충자료의 연도별 수치 사이 차이는 원인이 확인되지 않아 한쪽 값을 조정하지 않는다. (3) HBM 매출·이익 비중, 현재 수주·수주잔고 수치, 아오모리 2027~28 투자 가동 분기, 오이타 착공일, 해외 생산능력·고객 인증 일정은 인용 문서에서 확인하지 못했다. (4) 2026-10-18 기준 검증된 시장 컨센서스가 없어 기대 대비 상회·하회 판단은 보류한다. (5) 비공식 요약이나 콜 화면 캡처는 근거로 사용하지 않았다. (6) IR 캘린더의 게시일은 확인되지 않았으며 2026-10-18에 관찰한 일정을 인용한다. 인용 쪽수는 PDF 파일의 실제 페이지 순서다. 재고 구성 합계·설비투자 분기 합계·지역 매출 합계의 1백만엔 차이와 하반기 설비투자 표시값 차이도 원문 그대로 남긴다."],"source_ids":["MJC_Q2_SUP","MJC_Q2_RESULTS","MJC_Q2_DECK","MJC_GUIDE","MJC_CALENDAR","PCARD_C01_SNAPSHOT"],"table":{"columns":["항목","이전 표시값 / 대안 기준","본 프리뷰 채택값","차이 성격"],"rows":[["2026-Q2 영업이익","기존 표시 99.1억엔 / 누적 차감 9,910백만엔","9,909백만엔 (직접 분기표)","직접 분기표와 차감값 1 차이·구체적 원인 미확인"],["2026-Q3 파생 매출","249.9억엔","24,994백만엔 (74,200 − 49,206)","표시 자릿수 차이·기존 계산 기준 미확인"],["FY2026 설비투자 장비 소계","190억엔",null,"최신 자료에서 소계 미확인, 총액 21,000만 검증"],["2023~2026 누적 설비투자","608억엔 (설명회 자료)",null,"연도별 수치와 차이·원인 미확인, 미조정"],["재고 구성 합 vs 총액","13,189 / 14,202 (구성 합)","13,190 / 14,203 (보고 총액)","표시값 차이, 각 1백만엔·구체적 원인 미확인"],["설비투자 Q1+Q2 vs H1","8,924 (분기 합)","8,925 (H1 보고)","표시값 차이, 1백만엔·구체적 원인 미확인"],["하반기 설비투자 계획","12,075 (연간 21,000 − H1 8,925)","12,074 (회사 직접 표시)","1 차이·각 기준 보존"],["지역 매출 합 vs 연결","28,260 (지역 합)","28,261 (연결)","표시값 차이, 1백만엔·구체적 원인 미확인"],["컨센서스","과거 '컨센서스 대비' 서술",null,"2026-10-18 당시 미확인; 10월 21일 단일 애널리스트 관측은 별도 수록, 판정용 컨센서스는 보류"]]},"chart":null},{"id":"s10_consensus_audit","title":"시장 추정 관측 감사: MarketScreener 단일 애널리스트 분기 추정과 IFIS 누적·연간 컨센서스 (2026-10-21 관측)","body":["[관측] 2026-10-21 00:17(KST, 2026-10-20 15:17:40 UTC)에 브라우저로 렌더링된 MarketScreener 분기 손익 추정 패널(회계기간 표기 'Fiscal Period: December')을 표시 화면 DOM 기준으로 캡처했다. 같은 날 같은 주소에 대한 일반 HTTP 요청은 403으로 거부됐으므로 이 캡처는 서버 원본 응답이 아니라 표시된 화면의 증거다. 패널의 '2026 Q3' 열(12월 결산이므로 역년 2026-Q3, 2026-07-01~09-30과 동일)에는 Net sales 25,900, EBIT 7,300, Earnings before Tax(EBT) 7,000, Net income 5,200백만엔이 추정 서식으로 표시되고, 네 셀 모두 '추정을 제공한 애널리스트 수: 1'이라는 설명이 붙어 있다. 같은 패널의 '2026 Q4' 열은 29,894·9,143·9,740·7,139백만엔(각 애널리스트 1명)이다. 추정 수정일은 패널에 표시되지 않았고 해당 열의 발표일 칸은 '-'이며, 이 추정 표의 상위 데이터 제공자는 화면에서 식별되지 않았다. 따라서 관측 시각(2026-10-21)은 알지만 추정치 자체의 작성 시점은 알 수 없다.","[산술] 회사 9개월 누적 매출 가이드 74,200에서 상반기 실적 49,206을 뺀 기준점은 24,994백만엔이다. MarketScreener 표시 매출 25,900은 이 기준점보다 906백만엔(+3.6%) 높다. 차이율은 (표시값 − 회사 기준점) ÷ 회사 기준점 × 100으로 계산했다. 제공자의 EBIT·EBT·Net income은 원래 항목명으로 보존한다. 회사 영업이익·경상이익·순이익과의 정의 일치가 확인되지 않아 이익의 차이율과 합산 누적 환산은 사용하지 않는다. 제공자의 과거 매출 열에는 2022 Q2 9,767(회사 9,766), 2023 Q4 12,770(12,769), 2024 Q2 14,377(14,376), 2025 Q3 17,292(17,291)처럼 1백만엔 차이가 있다. 차이는 기록하되 제공자의 반올림·원자료 처리 방식은 확인되지 않아 원인을 단정하지 않는다.","[관측] IFIS(kabuyoho.jp) 표시 기준 2026년 12월기 연간 컨센서스는 매출 105,975·영업이익 32,400·경상이익 33,188·순이익 24,060백만엔(경상이익 표의 표시 날짜 2026/10/20, 애널리스트 수 미표시)으로 회사 연간 가이드 대비 각각 +2,175(+2.1%)·+1,000(+3.2%)·+1,188(+3.7%)·+1,060(+4.6%)이다. 같은 제공자의 진척률 표에는 9개월 누적 경상이익 컨센서스 20,126이 표시되는데, 이는 회사 9개월 가이드 23,100보다 2,974 낮고 상반기 실적 16,260보다 3,866 높다. 연간 33,188과는 대상 기간이 달라 두 값만으로 내부 불일치를 판단할 수 없으며, 개별 추정 시점도 표시되지 않는다. 누적 컨센서스에서 실적을 뺀 값을 분기 컨센서스로 쓰지 않는다. [해석] 이상은 2026-10-21 기준의 출처 비교 관측이다. 단일 애널리스트, 수정일 미상, 상위 제공자 미상이고 다른 사이트(Futu는 스크립트 껍데기, MarketScreener HTTP는 403)에서 독립 관측을 얻지 못했으므로 scenario.consensus는 null을 유지하고 상회·하회 판정 기준으로 쓰지 않는다. 같은 값을 표시하는 다른 사이트가 있더라도 같은 상위 제공자를 쓸 수 있어 독립 검증으로 세지 않는다. 9절의 2026-10-18 기준 서술은 그 날짜의 기록으로 유지한다."],"source_ids":["MJC_MS_Q_DOM","MJC_IFIS_ANNUAL","MJC_IFIS_PROGRESS","MJC_GUIDE","MJC_Q2_RESULTS","MJC_Q2_SUP"],"table":{"columns":["항목","회사 기준값(JPY백만)","제공자 표시값(JPY백만)","차이(JPY백만)","차이(%)","표시 애널리스트 수","비고"],"rows":[["2026-Q3 매출",24994,25900,906,3.6,1,"MarketScreener 'Net sales'; 기준값 = 9M 가이드 74,200 − H1 49,206"],["2026-Q3 영업이익 vs 제공자 EBIT",6843,7300,"비교 보류","비교 보류",1,"EBIT는 제공자 정의; 회사 영업이익과 동일 정의 미확인; 회사 지표와 추정 항목의 정의 일치 확인 전 차이율 미산출"],["2026-Q3 경상이익 vs 제공자 EBT",6840,7000,"비교 보류","비교 보류",1,"EBT는 제공자 정의; 경상이익으로 재명명하지 않음; 회사 지표와 추정 항목의 정의 일치 확인 전 차이율 미산출"],["2026-Q3 순이익",4839,5200,"비교 보류","비교 보류",1,"기준값 = 9M 가이드 16,300 − H1 11,461 (산술); 회사 지표와 추정 항목의 정의 일치 확인 전 차이율 미산출"],["9M 누적 경상이익 (IFIS 진척률 표)",23100,20126,-2974,-12.9,"미표시","회사 9M 가이드 vs IFIS 누적 컨센서스; 분기 환산 금지"],["FY2026 연간 매출 (IFIS)",103800,105975,2175,2.1,"미표시","회사 연간 가이드 vs IFIS 연간 컨센서스"],["FY2026 연간 경상이익 (IFIS)",32000,33188,1188,3.7,"미표시","IFIS 경상이익 표 날짜 2026/10/20"],["추정 수정일 / 상위 제공자","-","미표시 / 미식별","-","-","-","관측 2026-10-21 00:17 KST; '2026 Q3' 발표일 칸 '-'; 브라우저 표시 DOM 캡처"]]},"chart":{"kind":"bar","title":"2026-Q3 매출: 회사 가이드 차감 기준점과 MarketScreener 1명 추정 관측 (백만 엔, 2026-10-21 확인)","labels":["매출"],"series":[{"name":"회사 9M 가이드 − H1 실적 (산술 기준점)","values":[24994],"unit":"JPY_M"},{"name":"MarketScreener 표시값 (애널리스트 1명, 수정일 미표시)","values":[25900],"unit":"JPY_M"}],"source_ids":["MJC_MS_Q_DOM","MJC_GUIDE","MJC_Q2_RESULTS"]}},{"id":"s11_trade_audit","title":"무역통계 진단 감사: HS 903090000 일본 수출액(천엔)과 연결 매출의 전년동기 대비 증감률 비교 (2023-Q3~2026-Q2, 12개 분기)","body":["[관측·방법] 재무성 보통무역통계 '세관별 품별 국별표(수출)'의 HS 903090000(제9030호 계측·검사기기의 부분품·부속품) 전국 수출액을 e-Stat 표 0003425301(2021~2022년, 確定)과 0004002162(2023~2024년 確定, 2025년 確々報, 2026년 1~8월 確報)에서 2026-10-19(JST)에 취득한 보관본으로 집계했다. 이 품목은 여러 기업과 여러 기기 부품이 섞인 광범위한 산업 바스켓이며 동사 수출액도, 프로브카드만의 수치도 아니다. 값은 명목 천엔이고 환율 환산은 하지 않았으며 모든 세관·상대국 기록을 그대로 합산했다. 비교 창은 두 가지다. '동시 창'은 해당 역년 분기의 첫 2개월(예: 2026-Q2는 2026-04~05), '직전 분기 창'은 직전 역년 분기 3개월(2026-Q2는 2026-01~03)이다. 무역 YoY(%) = 100 × (창의 합 ÷ 전년 같은 달 합 − 1)로 월별 증가율의 평균이 아니라 합계로 계산했다. 매출 YoY(%) = 100 × (역년 분기 연결 매출 ÷ 전년 같은 분기 − 1)이며, 동사는 12월 결산이라 회계 분기와 역년 분기가 같다. 표본은 최신 실적 분기까지의 12개 역년 분기(2023-Q3~2026-Q2)로 고정했다. 매출은 FY2023·FY2024 결산 보충자료의 분기 실적 추이표와 FY2026 Q2 보충자료의 직접 분기표에서 가져온 직접 인쇄 분기값이다. 표 제목의 공표 단계와 수록 월은 2026-10-21에 다시 확인했으며, 계산에 쓴 월별 CSV는 10월 19일 보관본이다. 이후 월별 수치의 수정 여부를 새로 대조했다는 뜻은 아니다.","[산술] 피어슨 r = Σ(x−x̄)(y−ȳ) ÷ √(Σ(x−x̄)² × Σ(y−ȳ)²), 부호 일치는 sign(x) = sign(y)(0은 0과만 일치)로 계산했다. 동시 창(n=12)은 r = 0.596, 부호 일치 10/12(불일치 2023-Q4, 2025-Q1)이고, 직전 분기 창(n=12)은 r = 0.729, 부호 일치 11/12(불일치 2025-Q2)다. 인접 분기 간 변화 방향의 일치는 별도 통계로 동시 창 11/11, 직전 분기 창 7/11이다. 이번 검토에서 월별값으로부터 창의 합, YoY, 부호 일치 수, r을 독립적으로 다시 계산해 모두 입력 계산과 일치함을 확인했다. 최신 쌍인 2026-Q2는 동시 창 +68.6%, 직전 분기 창 +35.5%, 매출 +48.8%다. 참고로 목표 분기 2026-Q3에 해당하는 창은 이미 공표된 2026-07~08 합 59,514,695천엔(전년 같은 달 대비 +19.2%)과 2026-04~06 합 109,092,698천엔(+71.0%)이지만, 이는 관측값일 뿐 매출 추정에 쓰지 않는다.","[해석·한계] 이 결과는 사후적 기술 통계이며 예측력·인과관계·동사 출하와의 대응을 뜻하지 않는다. 시차 탐색, 보간, 결측 대체, 가중은 하지 않았고 매출 이력은 이후 공표된 비교표·보충자료의 수록값이며, 최초 발표 당시의 정보집합을 복원한 실시간 백테스트는 아니다. 2026년 월별값은 '確報', 2025년은 '確々報' 공표 단계라 개정될 수 있고, 명목 금액에는 단가·구성·환율 효과가 섞여 있다. 동사 매출의 93%가 아시아 판매라도 이 통계는 전국·전 기업의 합계이므로 동사 매출과 직접 대응시킬 수 없다. 따라서 2026-Q3 시나리오(회사 가이드 차감 24,994)는 이 진단과 무관하게 유지한다. 11월 12일 Q3 실적이 확정되면 고정 표본을 2023-Q4~2026-Q3로 한 분기 이동해 같은 산식으로 다시 계산해야 하며, 새 실제치가 없으면 표본 기간을 이동하지 않는다. 같은 기간의 공식 원자료가 수정되면 이전 계산을 보존하고 수정 자료로 재계산한다. 외삽은 하지 않는다."],"source_ids":["TRADE_ESTAT_0004002162","TRADE_ESTAT_0003425301","MJC_FY2023_SUP","MJC_FY2024_SUP","MJC_Q2_SUP"],"table":{"columns":["역년 분기","회사 회계 분기","동시 창(2개월)","동시 창 무역 YoY(%)","직전 분기 창(3개월)","직전 분기 창 무역 YoY(%)","연결 매출(JPY백만)","매출 기준","매출 YoY(%)","부호 일치(동시 / 직전)"],"rows":[["2023-Q3","FY2023 Q3","2023-07~08",-8.4,"2023-04~06",-18.2,8537,"직접 분기표",-19.2,"일치 / 일치"],["2023-Q4","FY2023 Q4","2023-10~11",9.2,"2023-07~09",-3.2,12769,"직접 분기표",-10.0,"불일치 / 일치"],["2024-Q1","FY2024 Q1","2024-01~02",20.1,"2023-10~12",12.2,11794,"직접 분기표",20.7,"일치 / 일치"],["2024-Q2","FY2024 Q2","2024-04~05",28.6,"2024-01~03",24.6,14376,"직접 분기표",99.2,"일치 / 일치"],["2024-Q3","FY2024 Q3","2024-07~08",24.2,"2024-04~06",28.1,12812,"직접 분기표",50.1,"일치 / 일치"],["2024-Q4","FY2024 Q4","2024-10~11",23.3,"2024-07~09",16.6,16659,"직접 분기표",30.5,"일치 / 일치"],["2025-Q1","FY2025 Q1","2025-01~02",-2.1,"2024-10~12",10.6,14124,"직접 분기표",19.8,"불일치 / 일치"],["2025-Q2","FY2025 Q2","2025-04~05",4.4,"2025-01~03",-4.3,18996,"직접 분기표",32.1,"일치 / 불일치"],["2025-Q3","FY2025 Q3","2025-07~08",18.9,"2025-04~06",3.8,17291,"직접 분기표",35.0,"일치 / 일치"],["2025-Q4","FY2025 Q4","2025-10~11",3.0,"2025-07~09",15.2,19761,"직접 분기표",18.6,"일치 / 일치"],["2026-Q1","FY2026 Q1","2026-01~02",36.8,"2025-10~12",13.2,20945,"직접 분기표",48.3,"일치 / 일치"] "FY3/27 Q2 (회사 표기 2026년도 제2사분기; 3월 결산, 2026-07-01~2026-09-30, 중간기 공시는 4~9월 누적)","period_end":"2026-09-30"},"scenario":{"status":"derived_guidance","basis":"회사는 단일 분기 가이던스를 제시하지 않음. 2026-08-07 수정 공시의 상반기(2026-04-01~09-30) 매출 가이던스 19,400백만엔에서 같은 날 발표된 FY3/27 Q1(2026-04-01~06-30) 실적 매출 9,641백만엔을 차감한 산술값: 19,400 − 9,641 = 9,759백만엔. 같은 방식으로 영업이익 5,400 − 3,094 = 2,306백만엔, 경상이익 5,300 − 3,192 = 2,108백만엔, 순이익 3,600 − 2,169 = 1,431백만엔. 회사가 단일 분기 전망 범위를 제시하지 않아 산술 기준점만 표시한다. 표시값 절사(백만엔 미만)에 따른 1백만엔 내외 오차 가능. 판정용 애널리스트 컨센서스는 보류하며, 2026-10-21에 확인한 단일 애널리스트 분기 추정은 출처 비교 절에 별도 수록한다.","revenue":{"low":null,"base":9759,"high":null,"unit":"JPY_M","source_ids":["JEM_GUIDE","JEM_Q1_RESULTS"]},"consensus":null},"thesis":"FY3/27 Q1(회사 표기 2026년도 1분기, 역년 2026-Q2)은 매출 9,641백만엔·영업이익 3,094백만엔(영업이익률 32.1%)으로 전년동기 대비 각각 +77.3%, +109.7%였다. 회사는 2026-08-07 상반기 가이드를 매출 16,000→19,400, 영업이익 3,400→5,400백만엔으로 올렸지만 하반기는 5월 가정을 그대로 두어 연간 상향분 전체가 상반기에서 나온다. 상반기 가이드에서 Q1 실적을 뺀 FY3/27 Q2(역년 2026-Q3) 산술 기준점은 매출 9,759백만엔·영업이익 2,306백만엔(영업이익률 23.6%)으로, 매출은 Q1과 거의 같고 영업이익은 −25.5%다. 반도체검사용부품 세그먼트가 매출의 99.5%와 세그먼트 이익 사실상 전부를 만들고, 매출총이익률은 전년동기 대비 하락했으나 판관비 희석으로 영업이익률이 올랐다. 재고 증가는 재공품에 집중됐고 완제품은 줄었으며, 매출채권이 늘고 현금은 줄었다. 공모증자 약 12,200백만엔이 전액 배정된 아마가사키 공장(2028년 8월 준공 예정)의 신규 생산능력은 이번 Q2 전망에 포함하지 않으며, 7월 28일 구마모토 지진은 Q2 기간 중 사건이다. 11월 10일 16시 중간기 발표의 핵심은 Q2 영업이익률을 Q1 실적 32.1% 및 산술 기준점 23.6%와 각각 비교하고, 그 차이가 매출총이익률과 판관비 중 어디서 났는지, 하반기 가이드 17,000·4,050이 유지되는지, 중간기 현금흐름표의 영업활동 현금흐름이다.","sections":[{"id":"s01_baseline","title":"1. 조건부 베이스라인: FY3/27 Q1 실적에서 상반기 가이드 차감 Q2 기준점으로","body":["[관측] FY3/27 Q1(회사 표기 '2026년도 제1사분기', 역년 2026-Q2, 2026-04-01~06-30)은 매출 9,641백만엔, 매출원가 5,081백만엔, 매출총이익 4,560백만엔, 판관비 1,466백만엔, 영업이익 3,094백만엔, 경상이익 3,192백만엔, 순이익 2,169백만엔(EPS 148.08엔)으로, 전년동기(FY3/26 Q1, 역년 2025-Q2: 매출 5,437·영업이익 1,475백만엔) 대비 매출 +77.3%, 영업이익 +109.7%, 경상이익 +126.6%, 순이익 +119.4%였다. 동사는 3월 결산이므로 회사의 분기 번호와 역년 분기가 어긋난다. 11월 10일 발표되는 '2026년도 제2사분기(중간기)' 공표 수치는 4~9월 누적 기준이므로, 역년 2026-Q3(2026-07-01~09-30)에 해당하는  Q2 단일 분기 값은 누적에서 Q1을 차감하거나 보충자료의 분기 추이표로 확인해야 하고 두 방식은 백만엔 미만 절사 때문에 1백만엔 차이가 날 수 있다.","[회사 가이드] 2026-08-07 수정 공시에서 회사는 상반기(2026-04-01~09-30) 매출 19,400·영업이익 5,400·경상이익 5,300·순이익 3,600백만엔, 연간(2026-04-01~2027-03-31) 매출 36,400·영업이익 9,450·경상이익 9,300·순이익 6,700백만엔을 제시했다. 회사는 단일 분기 가이던스를 내지 않는다. [산술] 상반기 가이드에서 Q1 실적을 뺀 FY3/27 Q2(역년 2026-Q3) 기준점은 매출 19,400 − 9,641 = 9,759백만엔, 영업이익 5,400 − 3,094 = 2,306백만엔, 경상이익 5,300 − 3,192 = 2,108백만엔, 순이익 3,600 − 2,169 = 1,431백만엔이며 영업이익률은 23.6%다. 이는 누적 가이드와 실적의 차이일 뿐 회사가 명시한 분기 계획이 아니고 범위도 없다. Q1 실적만으로 상반기 매출 가이드의 49.7%, 영업이익 가이드의 57.3%가 이미 채워졌다.","[산술] 파생 Q2 매출 9,759는 Q1 대비 +1.2%, 영업이익 2,306은 −25.5%이며 영업이익률은 Q1 32.1%보다 8.5pt 낮은 23.6%다. 이는 상반기 가이드에서 이미 발표된 Q1을 차감한 결과로, 실제 Q2 이익률의 상·하한이나 회사가 제시한 비용 계획이 아니다. [해석] 회사가 상향 요인으로 든 메모리용 프로브카드 수요, 선행 투자에 따른 생산 확대, 해외 매출과 환율이 실제 Q2에 얼마나 이어졌는지는 중간기 발표에서 확인해야 한다. 전년동기 FY3/26 Q2(역년 2025-Q3) 매출은 보충자료 분기표에서 6,885백만엔으로 확인되며, 영업이익은 공식 상반기 누적 2,657에서 Q1 1,475를 뺀 1,182백만엔이다. 현재 산술 기준점은 이 전년동기 값 대비 매출 +41.7%, 영업이익 +95.1%에 해당하며 실제 성장률은 발표 후 확인한다."],"source_ids":["JEM_Q1_RESULTS","JEM_Q1_SUP","JEM_GUIDE","JEM_CALENDAR"],"table":{"columns":["구분","기간","매출(JPY백만)","영업이익(JPY백만)","영업이익률(%, 산술)","근거 유형"],"rows":[["FY3/26 Q1 (2025-Q2)","2025-04-01~06-30",5437,1475,27.1,"관측: 결산단신 전년동기 비교"],["FY3/26 Q2 (2025-Q3)","2025-07-01~09-30",6885,1182,17.2,"매출: 공식 분기표 / 영업이익: 공식 상반기 누적 − Q1"],["FY3/27 Q1 (2026-Q2)","2026-04-01~06-30",9641,3094,32.1,"관측: 결산단신"],["FY3/27 상반기 가이드(2026-05-14, 수정 전)","2026-04-01~09-30",16000,3400,21.3,"회사 가이드(구)"],["FY3/27 상반기 가이드(2026-08-07)","2026-04-01~09-30",19400,5400,27.8,"회사 가이드"],["FY3/27 Q2 (2026-Q3) 파생 기준점","2026-07-01~09-30",9759,2306,23.6,"산술: 상반기 가이드 − Q1 실적"],["FY3/27 연간 가이드(2026-08-07)","2026-04-01~2027-03-31",36400,9450,26,"회사 가이드"],["FY3/27 하반기 (2026-Q4+2027-Q1) 가이드 차이","2026-10-01~2027-03-31",17000,4050,23.8,"산술: 연간 가이드 − 상반기 가이드"]]},"chart":{"kind":"bar","title":"분기 매출·영업이익: 과거 실적과 FY3/27 Q2 산술 기준점 (JPY백만)","labels":["2025-Q2 (FY3/26 Q1)","2025-Q3 (FY3/26 Q2)","2026-Q2 (FY3/27 Q1)","2026-Q3 (FY3/27 Q2)"],"series":[{"name":"매출 실적","values":[5437,6885,9641,null],"unit":"JPY_M"},{"name":"매출 파생 기준점(상반기 가이드 − Q1 실적)","values":[null,null,null,9759],"unit":"JPY_M"},{"name":"영업이익 실적(2025-Q3는 공식 누적 차분)","values":[1475,1182,3094,null],"unit":"JPY_M"},{"name":"영업이익 파생 기준점(상반기 가이드 − Q1 실적)","values":[null,null,null,2306],"unit":"JPY_M"}],"source_ids":["JEM_Q1_RESULTS","JEM_GUIDE","JEM_Q1_SUP"]}},{"id":"s02_segments","title":"2. 반도체검사용부품 vs 전자관부품: 세그먼트 수익성과 전사 조정의 구조","body":["[관측] Q1 세그먼트 매출은 반도체검사용부품 9,593백만엔, 전자관부품 48백만엔으로 합계 9,641백만엔이 연결 매출과 일치한다. 세그먼트 이익은 각각 3,624백만엔과 1백만엔이고, 조정액 −531백만엔을 더하면 연결 영업이익 3,094백만엔이 된다. [산술] 세그먼트 마진은 반도체검사용부품 37.8%, 전자관부품 2.1%이며 조정액은 연결 매출의 5.5%에 해당한다. 전자관부품은 매출의 0.5%, 세그먼트 이익 합계의 약 0.03%로 현재 연결 실적에 대한 비중이 작다.","[해석] Q2 연결 영업이익을 읽을 때는 반도체검사용부품 세그먼트 이익과 전사 조정액을 분리해 확인한다. [산술·가정] 전사 조정이 Q1 수준(−531)에 머문다고 가정하면 파생 영업이익 2,306에 대응하는 전체 세그먼트 이익 합계는 2,837백만엔이다. 이를 연결 매출 기준점 9,759로 나눈 비율은 29.1%로, 같은 분모 기준의 Q1 비율 37.6%((3,624+1)/9,641)와 비교할 수 있다. 이는 전사 조정액을 고정한 산술 예시이며 반도체검사용부품만의 마진이나 회사 계획은 아니다. 공식 주석에 따르면 전사 조정은 주로 총무·경리 등 관리부문 비용이다. 향후 변화의 원인을 특정 공장 준비비나 제품 믹스로 바로 귀속하지 않고, 세그먼트와 전사 비용의 설명을 각각 대조한다."],"source_ids":["JEM_Q1_RESULTS","JEM_GUIDE"],"table":{"columns":["세그먼트","Q1 매출(JPY백만)","Q1 세그먼트 이익(JPY백만)","마진(%, 산술)","매출 비중(%, 산술)","근거 유형"],"rows":[["반도체검사용부품",9593,3624,37.8,99.5,"관측: 결산단신 세그먼트 주석"],["전자관부품",48,1,2.1,0.5,"관측: 결산단신 세그먼트 주석"],["조정액(전사)",null,-531,null,null,"관측: 결산단신 세그먼트 주석"],["연결",9641,3094,32.1,100,"관측 / 마진 산술"],["파생 Q2: 전사 조정 −531 가정 시 전체 세그먼트 이익 합계",null,2837,29.1,null,"산술·가정: 2,306 + 531; 연결 매출 9,759 대비 비율, 특정 세그먼트 마진 아님"]]},"chart":null},{"id":"s03_demand_mix","title":"3. 선단 메모리 수요와 비메모리 확장: 타입 믹스 M77·V16·C7, 지역 믹스, 수주 수치 부재","body":["[관측] 회사가 공개하는 Q1 프로브카드 타입별 구성은 M타입 77%, V타입 16%, C타입 7%다. 회사는 상반기 상향의 배경으로 메모리용 프로브카드 수요, 선행 투자에 따른 생산 확대, 해외 매출, 가정보다 약한 엔화를 들었다. HBM 매출·이익 비중은 공개되지 않았고 타입 구성은 회사의 제품 분류이므로, M타입 77%를 HBM 비중이나 메모리 비중으로 바꿔 읽어서는 안 된다. 본 프리뷰는 HBM 기여를 수치로 추정하지 않는다. 수주·수주잔고 수치도 인용 자료에 없다.","[관측] Q1 지역별 매출은 일본 4,558, 아시아 4,411, 북미 531, 유럽 140백만엔으로 합계 9,640은 연결 9,641과 1백만엔 절사 차이가 있다. 일본 비중은 47%로 전분기 42%에서 5pt 올랐다. [산술] 해외 합계는 5,082백만엔(52.7%)이다. 이 구분은 회사의 판매처 기준이며 고객사나 최종 수요처를 특정하지 않는다. [해석] 회사가 해외 매출을 상향 요인으로 들었는데도 일본 비중이 올랐다는 것은 국내 매출이 해외보다 더 빠르게 늘었다는 뜻이다. 국내 매출이 절반에 가깝고 판매 지역과 수출 통계의 집계 범위도 다르므로 일본 수출 통계를 연결 매출에 직접 대응시킬 수 없다. 본 프리뷰는 무역통계로 Q2 매출을 추정하지 않는다.","[관측] 비메모리 방향에 대해 회사는 300mm 풀웨이퍼 콘택트와 고온 프로빙 경험을 메모리에서 선단 로직으로 이전하고, 칩렛 확산으로 KGD(Known Good Die) 웨이퍼 테스트 요구가 늘어나는 흐름에 대응하겠다는 전략 방향을 제시했다. 이는 개발·전략 단계의 서술이며 별도 매출로 계량되지 않았다. [해석] 11월 10일에는 V타입·C타입 비중의 변화와 비메모리 코멘트를 보되, 타입 비중 1~2pt 변화는 메모리 물량 변동만으로도 생기므로 비중보다 회사의 정성 설명과 지역 구성을 함께 읽어야 한다. 수주 수치가 없어 가이드 수정 이력(6절), 재고 구성(4절), 회사의 수요 설명을 함께 살펴본다. 재공품만으로 수요 강도를 확정하지 않는다."],"source_ids":["JEM_Q1_SUP","JEM_GUIDE","JEM_MIDTERM"],"table":{"columns":["구분","항목","Q1 값(JPY백만)","비중(%)","비고"],"rows":[["타입 믹스","M타입",null,77,"관측: 회사 제품 분류, HBM 비중 아님"],["타입 믹스","V타입",null,16,"관측"],["타입 믹스","C타입",null,7,"관측"],["지역","일본",4558,47.3,"관측 / 비중 산술(회사 표기 47%, 전분기 42%)"],["지역","아시아",4411,45.8,"관측 / 산술"],["지역","북미",531,5.5,"관측 / 산술"],["지역","유럽",140,1.5,"관측 / 산술"],["지역","4개 지역 합",9640,null,"산술: 연결 9,641과 1백만엔 절사 차이"],["수요","HBM 매출·이익 비중",null,null,"비공개"],["수요","수주·수주잔고 수치",null,null,"인용 자료에 없음, 추정하지 않음"]]},"chart":null},{"id":"s04_wip_fixed_assets","title":"4. 재공품 확대·완제품 감소와 고정자산: Q2 생산 파이프라인과 감가상각 경로","body":["[관측] 재고자산은 2026-03-31 4,577백만엔에서 2026-06-30 5,036백만엔으로 늘었다. 구성은 제품 574→512, 재공품 1,768→2,157, 원재료·저장품 2,234→2,366백만엔이다(구성 합 4,576·5,035는 보고 총액보다 각 1백만엔 작음). [산술] 표시값 기준 증가 459백만엔(회사 공표 증가액 458) 가운데 재공품 +389, 원재료·저장품 +132, 제품 −62로, 증가는 재공품에 집중됐고 완제품은 오히려 줄었다. 재공품 비중은 38.6%에서 42.8%로 올랐다. 재고 증가율 +10.0%는 보충자료의 전분기 매출 8,691에서 Q1 9,641로 늘어난 증가율 +10.9%와 비슷하다. 서로 다른 시점의 잔액과 기간 매출을 비교한 것이므로 이것만으로 재고 적정성이나 출하 속도를 확정하지 않는다.","[관측] 유형자산 순액은 12,917→12,989백만엔으로 표시값 기준 72백만엔 늘었으며 보충자료 공표 증가는 71백만엔이다. 건설가계정은 유형자산에 포함되며 2,070→1,918백만엔으로 줄었다. Q1 감가상각비는 361백만엔이고, 연간 계획은 설비투자 7,000·감가상각 1,800백만엔이다. 1분기 결산단신에는 현금흐름표가 없어 이 자료만으로 실제 설비투자 현금 지출을 확인할 수 없다. [산술] Q1 감가상각 361은 연간 계획의 20.1%다. [해석] 유형자산 순액은 취득, 감가상각, 처분 등 여러 변화를 함께 담으므로 증가가 작다는 이유로 투자 집행이 적었다고 판단하지 않는다. 자료는 공장별 감가상각 계획이나 아마가사키 공장의 비용 인식 시점을 분해하지 않아 연간 1,800 전액을 기존 설비 비용으로 단정할 수 없다.","[해석] Q1 말 제품 512백만엔은 Q1 매출의 5.3%다. Q2에는 늘어난 재공품이 제품·매출로 이어졌는지, 이후 생산 투입과 재고 구성이 어떻게 변했는지를 함께 본다. 제품 증가가 확인되면 출하 일정, 제품 구성, 수요 변화 등 가능한 원인을 회사 설명과 대조하되 곧바로 출하 지연이나 지진 영향으로 판단하지 않는다. 재공품 증가도 다음 분기 수요를 보장하지 않으며, 재고 감소 역시 출하·투입 감소·평가조정 등을 구분해야 한다."],"source_ids":["JEM_Q1_SUP","JEM_Q1_RESULTS","JEM_FY25_DECK"],"table":{"columns":["항목","2026-03-31","2026-06-30","증감(산술, 표시값 차이)","근거 유형"],"rows":[["재고자산 합계(JPY백만)",4577,5036,459,"관측: 보고 총액 (회사 공표 증가액 458)"],["  제품",574,512,-62,"관측"],["  재공품",1768,2157,389,"관측"],["  원재료 및 저장품",2234,2366,132,"관측"],["  구성 합",4576,5035,459,"산술: 보고 총액보다 각 1 작음"],["재공품 비중(%)",38.6,42.8,4.2,"산술: 재공품 / 보고 총액"],["유형자산 순액(JPY백만)",12917,12989,72,"관측; 증감 72는 표시값 차이, 회사 공표 증가액 71"],["건설가계정(JPY백만; 유형자산에 포함)",2070,1918,-152,"관측 / 표시값 차이"],["Q1 감가상각비(JPY백만, 2026-04~06)",null,361,null,"관측; 연간 계획 1,800의 20.1%"]]},"chart":{"kind":"stack","title":"재고자산 구성 (JPY백만, 구성 합은 보고 총액 4,577·5,036보다 각 1 작음)","labels":["2026-03-31","2026-06-30"],"series":[{"name":"제품","values":[574,512],"unit":"JPY_M"},{"name":"재공품","values":[1768,2157],"unit":"JPY_M"},{"name":"원재료 및 저장품","values":[2234,2366],"unit":"JPY_M"}],"source_ids":["JEM_Q1_RESULTS","JEM_Q1_SUP"]}},{"id":"s05_margins","title":"5. 매출총이익률 하락 vs 영업이익률 상승: 판관비 레버리지와 파생 Q2 23.6%의 간격","body":["[산술] 매출총이익률은 전년동기 51.4%(2,797/5,437)에서 47.3%(4,560/9,641)로 4.1pt 하락했지만 영업이익률은 27.1%에서 32.1%로 5.0pt 상승했다. 간격은 판관비에서 나왔다. 판관비는 1,322→1,466백만엔으로 +10.9%에 그쳐 매출 +77.3%를 크게 밑돌았고 판관비율은 24.3%에서 15.2%로 9.1pt 내려갔다. 공식 손익계산서의 매출원가는 2,639→5,081백만엔(+92.5%)으로 매출보다 빠르게 늘었다. 전년 매출 5,437에서 총이익 2,797을 빼면 2,640이지만, 각 행의 백만엔 미만 절사로 직접 공시 원가 2,639와 1백만엔 차이가 난다. [산술] 영업이익률 상승은 판관비율 하락이 총이익률 하락을 상쇄한 결과다. 따라서 이전에 저장된 '영업이익률 상승은 HBM 믹스 고도화를 뒷받침한다'는 서술은 근거가 없으며, 회사가 원가율 상승 요인을 인용 자료에서 수치로 분해하지 않았으므로 믹스·환율·신규 설비 비용 중 무엇이 원인인지도 단정하지 않는다.","[산술] 파생 Q2 영업이익률 23.6%(2,306/9,759)는 Q1 32.1%보다 8.5pt 낮다. [산술·가정] 판관비가 Q1 수준 1,466에 머문다면 파생 영업이익에 대응하는 매출총이익은 3,772, 총이익률은 38.7%다. 반대로 총이익률을 Q1의 정확한 계산값(4,560/9,641)으로 고정하면 판관비 약 2,310백만엔이 대응한다. 두 계산은 가정을 바꾼 민감도 예시이며 회사의 원가율·비용 계획이나 실제 Q2 이익률 범위를 뜻하지 않는다. 11월 10일에는 실제 총이익률과 판관비를 각각 대조하고, 실적이 두 기준점 모두에서 벗어날 가능성도 열어 둔다.","[관측] Q1 경상이익 3,192과 영업이익 3,094의 차이 +98백만엔에는 환차익 118백만엔이 포함됐다. [회사 가이드·산술] 상반기 가이드에서 경상이익 5,300은 영업이익 5,400보다 100 작으며, Q1 실적을 차감한 Q2 영업외 순액은 2,108−2,306=−198백만엔이다. 회사가 이 순액의 구성이나 환율 가정을 수치로 분해하지 않았으므로 이를 엔화 강세 또는 Q1 환차익의 반전 가정으로 단정하지 않는다. 실제 경상·순이익이 기준점에서 벗어나면 환차손익 등 영업외 항목과 영업 실적을 분리해 확인한다."],"source_ids":["JEM_Q1_RESULTS","JEM_GUIDE"],"table":{"columns":["항목","FY3/26 Q1 (2025-Q2)","FY3/27 Q1 (2026-Q2)","FY3/27 Q2 (2026-Q3) 파생","근거 유형"],"rows":[["매출(JPY백만)",5437,9641,9759,"관측 / 관측 / 산술"],["매출원가(JPY백만)",2639,5081,null,"공식 손익계산서 직접값; 전년 매출−총이익 2,640과 절사 차이 1"],["매출총이익(JPY백만)",2797,4560,null,"관측"],["매출총이익률(%)",51.4,47.3,null,"산술"],["판관비(JPY백만)",1322,1466,null,"관측"],["판관비율(%)",24.3,15.2,null,"산술"],["영업이익(JPY백만)",1475,3094,2306,"관측 / 관측 / 산술(5,400 − 3,094)"],["영업이익률(%)",27.1,32.1,23.6,"산술"],["경상이익(JPY백만)",1408,3192,2108,"관측 / 산술(5,300 − 3,192)"],["영업외 순액(JPY백만)",-67,98,-198,"산술(경상 − 영업); Q1에 환차익 118 포함"],["순이익(JPY백만)",988,2169,1431,"관측 / 산술(3,600 − 2,169)"]]},"chart":{"kind":"bar","title":"마진 구조 비교: 매출총이익률·판관비율·영업이익률 (%, 파생 Q2는 영업이익률만 산출 가능)","labels":["매출총이익률","판관비율","영업이익률"],"series":[{"name":"FY3/26 Q1 (2025-Q2) 실적","values":[51.4,24.3,27.1],"unit":"%"},{"name":"FY3/27 Q1 (2026-Q2) 실적","values":[47.3,15.2,32.1],"unit":"%"},{"name":"FY3/27 Q2 (2026-Q3) 파생 기준점","values":[null,null,23.6],"unit":"%"}],"source_ids":["JEM_Q1_RESULTS","JEM_GUIDE"]}},{"id":"s06_guidance_h2_cash","title":"6. 상반기만 상향된 가이드와 불변의 하반기, 그리고 현금 전환: 매출채권 증가·현금 감소","body":["[회사 가이드] 2026-05-14 가이드는 상반기 매출 16,000·영업이익 3,400·경상이익 3,300·순이익 2,400, 연간 매출 33,000·영업이익 7,450·경상이익 7,300·순이익 5,500백만엔이었다. 2026-08-07 수정으로 상반기는 매출 +3,400(+21.3%), 영업이익 +2,000(+58.8%), 경상이익 +2,000, 순이익 +1,200 올랐고, 연간도 정확히 같은 금액(매출 +3,400, 영업이익 +2,000, 경상이익 +2,000, 순이익 +1,200)만 올랐다. [산술] 연간에서 상반기를 뺀 하반기(2026-10-01~2027-03-31) 값은 수정 전후 모두 매출 17,000·영업이익 4,050·경상이익 4,000·순이익 3,100으로 동일하다. 회사는 하반기를 5월 가정 그대로 두었다고 밝혔고 그 이유로 수요·환율 불확실성을 들었다. 배당은 연간 80엔 예상에서 100엔(중간 60엔·기말 40엔)으로 상향됐다.","[산술] Q1 영업이익률 32.1%, 상반기 가이드 차감 Q2 기준점 23.6%, 연간−상반기 차감 하반기 비율 23.8%는 서로 다른 기간과 기준이다. 하반기 23.8%는 6개월 합계 비율이며 개별 분기의 이익률이 같다는 뜻이 아니다. 하반기 매출 17,000은 상반기 가이드보다 12.4%, 영업이익 4,050은 25.0% 낮다. [해석] 회사가 8월에 하반기 가정을 유지했으므로 11월 발표에서는 상반기 실제와 함께 하반기 17,000·4,050을 유지하는지, 수요·환율에 관한 설명이 달라지는지 확인한다. 재수정 여부와 폭은 미리 가정하지 않는다.","[관측] 매출채권은 11,336→13,960백만엔으로 표시값 기준 2,624(회사 공표 2,623) 늘었고, 현금 및 예금은 27,110→25,043백만엔으로 표시값 기준 2,067(회사 공표 2,066) 줄었다. Q1 현금흐름표는 작성되지 않았다. [산술] 말일 매출채권은 해당 분기 매출의 1.45배이며, 매출채권과 재고 증가 합계는 표시값 기준 3,083백만엔이다. [해석] 채권 증가와 현금 감소만으로 이익의 현금 전환을 판정할 수 없다. 현금에는 투자·차입 상환·배당 등도 영향을 주므로 중간기 현금흐름표가 공시되면 영업활동 현금흐름과 설비투자 지출, 기타 현금 변동을 나누어 확인한다. 대차대조표 변화로 영업현금흐름이나 투자액을 역산하지 않는다."],"source_ids":["JEM_GUIDE","JEM_Q1_SUP","JEM_Q1_RESULTS","JEM_FY25_DECK"],"table":{"columns":["항목","2026-05-14 가이드","2026-08-07 가이드","변화(산술)","근거 유형"],"rows":[["상반기 매출(JPY백만)",16000,19400,3400,"회사 가이드"],["상반기 영업이익(JPY백만)",3400,5400,2000,"회사 가이드"],["상반기 경상이익(JPY백만)",3300,5300,2000,"회사 가이드"],["상반기 순이익(JPY백만)",2400,3600,1200,"회사 가이드"],["연간 매출(JPY백만)",33000,36400,3400,"회사 가이드"],["연간 영업이익(JPY백만)",7450,9450,2000,"회사 가이드"],["연간 경상이익(JPY백만)",7300,9300,2000,"회사 가이드"],["연간 순이익(JPY백만)",5500,6700,1200,"회사 가이드"],["하반기 매출(연간 − 상반기)",17000,17000,0,"산술"],["하반기 영업이익(연간 − 상반기)",4050,4050,0,"산술"],["하반기 경상이익(연간 − 상반기)",4000,4000,0,"산술"],["하반기 순이익(연간 − 상반기)",3100,3100,0,"산술"],["연간 배당(엔/주)",80,100,20,"회사 가이드(중간 60·기말 40)"]]},"chart":{"kind":"bar","title":"FY3/27 가이드 수정 전후: 상반기·하반기(산술)·연간 매출과 영업이익 (JPY백만)","labels":["상반기 매출","하반기 매출(산술)","연간 매출","상반기 영업이익","하반기 영업이익(산술)","연간 영업이익"],"series":[{"name":"2026-05-14 가이드","values":[16000,17000,33000,3400,4050,7450],"unit":"JPY_M"},{"name":"2026-08-07 가이드","values":[19400,17000,36400,5400,4050,9450],"unit":"JPY_M"}],"source_ids":["JEM_GUIDE"]}},{"id":"s07_amagasaki","title":"7. 아마가사키 공장(구 본사 제2공장(가칭)): 2028년 8월 준공 일정, 공모증자 자금, FY2026 투자·상각 경로","body":["[관측] 2026-02-06 공시에서 회사는 본사 소재지 아마가사키에 신공장(당시 명칭 '본사 제2공장(가칭)')을 짓는다고 밝혔다. 투자 예정액 약 12,500백만엔, 착공 계획 2026년 4월, 준공 예정 2028년 8월, 건축면적 약 3,000㎡, 연면적 약 8,000㎡이며 재원은 당시 자기자금과 차입으로 설명했다. 2026-05-14 중기계획 진척 자료에서 명칭은 '아마가사키 공장'으로 확정됐고, 2026-02-25 결의한 공모증자로 조달한 약 12,200백만엔 전액을 이 공장에 배정하며 기존 3개 공장 투자는 자기자금과 차입으로 충당한다고 재원 설명이 바뀌었다. 역할은 M타입 프로브 개발·제조 강화로, 본사(프로브 제조)·산다(스페이스 트랜스포머 기판)·구마모토(조립)로 이어지는 분산 생산 체인의 상류를 보강한다. 5월 19일 설명자료 16쪽은 부지 약 7,100㎡, 철골 4층, 1층과 3층 클린룸 계획을 추가로 제시했다. 실제 착공일은 인용 자료에서 확인되지 않았다.","[관측] FY2026(2026-04~2027-03) 계획은 설비투자 7,000·연구개발비 2,200·감가상각비 1,800백만엔이다. 설비투자 실적은 FY2024(2024-04~2025-03) 4,015, FY2025(2025-04~2026-03) 3,866백만엔이었고, 중기계획(FY2024~2026) 3개년 누계 계획은 당초 8,500에서 14,882백만엔으로 늘었다(연도 합 14,881과 1백만엔 절사 차이). [산술] FY2026 계획 7,000은 FY2025 실적의 1.8배이며 누계 계획 증액분은 6,382백만엔(+75.1%)이다. 공모증자 12,200은 아마가사키 투자액 12,500의 97.6%를 덮는다. [해석] FY2026은 중기계획의 마지막 연도이므로 중간기 설비투자 공시로 7,000 계획 대비 진척을 확인한다. 아마가사키 지출 개시 여부는 공장별 내역이 별도로 공개되는지에 따라 확인 범위가 달라진다.","[해석] 아마가사키 공장의 준공 예정은 2028년 8월이므로 이번 Q2에 신공장의 신규 생산능력이 가동된다고 가정하지 않는다. 회사 중기계획은 기존 본사·산다·구마모토 3개 공장의 생산능력 강화와 새 공장 투자를 함께 제시한다. 다만 건설비의 실제 지출, 준비 비용의 손익 반영, 자산별 사용 개시와 감가상각 시점은 이 자료에서 구분되지 않는다. 준공 전 모든 지출이 자산으로만 남거나 비용이 준공 후에만 발생한다고 단정하지 않으며, FY2026 감가상각 계획 1,800도 공장별로 배분하지 않는다. 신규 생산능력의 구체적 수치는 검증되지 않아 추정하지 않는다."],"source_ids":["JEM_FACTORY","JEM_MIDTERM","JEM_FY25_DECK"],"table":{"columns":["시점","내용","금액(JPY백만)","근거 유형","Q2 프리뷰 취급"],"rows":[["2024-10","구마모토 제4공장 준공",null,"관측: 결산 설명회 자료","현재 생산능력의 일부"],["2026-02-06","신공장 건설 공시(본사 제2공장(가칭)); 착공 계획 2026-04, 준공 예정 2028-08; 건축 약 3,000㎡·연면적 약 8,000㎡",12500,"관측: 공시","신공장 신규 생산능력의 Q2 가동을 가정하지 않음"],["2026-05-14","명칭 '아마가사키 공장' 확정; 공모증자 약 12,200 전액 배정; M타입 프로브 개발·제조 강화",12200,"관측: 중기계획 진척 자료","재원 설명 변경 반영"],["FY2024 실적","설비투자(2024-04~2025-03)",4015,"관측","-"],["FY2025 실적","설비투자(2025-04~2026-03)",3866,"관측","-"],["FY2026 계획","설비투자 7,000 / 연구개발비 2,200 / 감가상각비 1,800 (2026-04~2027-03)",7000,"회사 계획","중간기 진척 확인"],["FY2024~2026 누계 계획","당초 8,500 → 14,882",14882,"회사 계획","연도 합 14,881과 1 차이"],["2028-08","아마가사키 공장 준공 예정",null,"회사 계획","Q2 추정 미반영"]]},"chart":{"kind":"bar","title":"설비투자: FY2024·FY2025 실적과 FY2026 계획 (JPY백만, 3월 결산 연도)","labels":["FY2024 (2024-04~2025-03)","FY2025 (2025-04~2026-03)","FY2026 (2026-04~2027-03)"],"series":[{"name":"설비투자 실적","values":[4015,3866,null],"unit":"JPY_M"},{"name":"설비투자 계획","values":[null,null,7000],"unit":"JPY_M"}],"source_ids":["JEM_MIDTERM","JEM_FY25_DECK"]}},{"id":"s08_kumamoto_quake","title":"8. 7월 28일 구마모토 지진: Q2 기간 중 운영 사건의 사실 범위","body":["[관측] 2026-07-28 구마모토 지진 후 회사는 2026-07-31 두 번째 업데이트에서 임직원 안전을 확인했고, 건물 일부에 경미한 손상이 있으나 조업에 지장이 없으며, 일부 설비는 점검·조정이 필요했고 7월 29일부터 순차적으로 가동을 재개했다고 밝혔다. 2026-08-07 실적 발표 시점에 회사는 실적 영향을 한정적이라고 판단했으나 금액으로 제시하지 않았고, 완전 복구 완료일도 공표하지 않았다.","[해석] 구마모토는 생산 체인의 조립 단계이므로 회사의 생산·납품 일정 설명을 확인할 필요가 있다. 8월 7일 상반기 가이드는 지진 이후 당시 가용 정보에 따라 작성됐고 회사는 실적 영향을 한정적이라고 판단했다. 영향이 0이거나 모든 설비가 완전히 복구됐다는 뜻은 아니다. 11월에는 추가 설명이나 영향 금액이 공시되는지 확인하며, 재고·매출 변화만으로 지진에 따른 지연 규모를 계산하지 않는다."],"source_ids":["JEM_QUAKE","JEM_GUIDE","JEM_MIDTERM"],"table":{"columns":["일자","사실","근거 유형"],"rows":[["2026-07-28","구마모토 지진 발생","관측: 회사 공시"],["2026-07-29","설비 점검·조정 후 순차 가동 재개 시작","관측: 회사 공시"],["2026-07-31","두 번째 업데이트: 임직원 안전, 건물 일부 경미 손상·조업 지장 없음","관측: 회사 공시"],["2026-08-07","실적 영향 '한정적' 판단, 금액 미제시; 같은 날 상반기 가이드 상향","관측: 회사 설명"],["미공표","완전 복구 완료일, 영향 금액","미공표·추정하지 않음"]]},"chart":null},{"id":"s09_watchpoints","title":"9. 11월 10일 16시 FY3/27 중간기 발표 체크리스트","body":["[관측] 회사 IR 일정은 2026년도 제2사분기(중간기) 결산 발표를 2026-11-10 16:00(일본 시간), 결산 설명회를 2026-11-13으로 안내한다. 발표 수치는 4~9월 누적 중간기 기준이므로 역년 2026-Q3 단일 분기 값은 누적에서 Q1(매출 9,641·영업이익 3,094)을 차감하거나 보충자료 분기 추이표로 확인하며, 두 방식은 1백만엔 차이가 날 수 있다.","[해석] 확인 순서는 다음과 같다. 첫째, 상반기 누적 매출·영업이익의 19,400·5,400 대비 위치와 하반기 17,000·4,050, 연간 36,400·9,450의 재수정 여부. 둘째, Q2 단일 분기 영업이익률을 산술 기준점 23.6%와 Q1 실적 32.1%에 각각 비교하고, 그 차이가 매출총이익률과 판관비 중 어디에서 났는지. 셋째, 반도체검사용부품 세그먼트 이익과 전사 조정액(−531)의 분리. 넷째, 재고 구성에서 재공품 2,157의 전환과 완제품 512의 증감, 매출채권 13,960의 방향. 다섯째, 중간기 현금흐름표가 공시되면 영업활동 현금흐름과 설비투자 지출, 연간 7,000 대비 진척과 아마가사키 관련 별도 설명 확인. 여섯째, 경상이익·순이익과 영업이익의 괴리(환차손익). 일곱째, 타입 믹스(M77·V16·C7)와 지역 구성(일본 47%)의 변화, 비메모리·로직 코멘트. 여덟째, 구마모토 지진 영향의 금액화 여부. 인용 자료에는 수주·수주잔고 수치가 없으며 신규 공개 여부는 발표 자료에서 확인한다."],"source_ids":["JEM_CALENDAR","JEM_GUIDE","JEM_Q1_RESULTS","JEM_Q1_SUP","JEM_FY25_DECK","JEM_QUAKE"],"table":{"columns":["순번","확인 항목","비교 기준값","기준값 성격"],"rows":[[1,"상반기 누적 매출 / 영업이익(JPY백만)","19,400 / 5,400","회사 가이드(2026-08-07)"],[2,"Q2 단일 분기 매출 / 영업이익(JPY백만)","9,759 / 2,306","산술: 상반기 가이드 − Q1 실적"],[3,"Q2 영업이익률(%)","23.6 (파생) vs 32.1 (Q1 실적)","산술"],[4,"Q2 매출총이익률 / 판관비(JPY백만)","47.3% / 1,466 (Q1)","산술 / 관측(Q1)"],[5,"반도체검사용부품 세그먼트 이익 / 전사 조정(JPY백만)","3,624 / -531 (Q1)","관측(Q1)"],[6,"재고 합계 / 재공품 / 제품(JPY백만)","5,036 / 2,157 / 512","관측(2026-06-30)"],[7,"매출채권 / 현금 및 예금(JPY백만)","13,960 / 25,043","관측(2026-06-30)"],[8,"중간기 영업활동 현금흐름 / 설비투자 지출(JPY백만)","Q1 비공개 / 연간 계획 7,000","관측 없음 / 회사 계획"],[9,"Q2 경상이익 / 순이익(JPY백만)","2,108 / 1,431","산술: 상반기 가이드 − Q1 실적"],[10,"하반기 매출 / 영업이익 가이드 유지 여부(JPY백만)","17,000 / 4,050","산술: 연간 − 상반기 가이드(5월·8월 동일)"],[11,"타입 믹스 / 일본 비중(%)","M77·V16·C7 / 47","관측(Q1)"],[12,"구마모토 지진 영향 금액","미제시('한정적')","관측(2026-08-07 회사 판단)"]]},"chart":null},{"id":"s10_limitations","title":"10. 출처 한계와 수치 불일치: 파생 매출 9,759 vs 이전 9,760, 공장 명칭·준공일, 미검증 항목","body":["[관측] 이전 저장 표시값(2026-09-02 기준)과의 차이는 다음과 같다. (1) 2026-08-07 가이드 기반 Q2 파생 매출을 9,760백만엔으로 표기했으나 정확한 계산은 19,400 − 9,641 = 9,759백만엔이다. (2) 신공장 명칭이 '본사 제2공장(가칭)'으로 남아 있었으나 2026-05-14 이후 공식 명칭은 '아마가사키 공장'이며, 재원 설명도 자기자금·차입에서 공모증자 약 12,200 전액 배정으로 바뀌었다. (3) 구마모토 증설 시점이 2024-11 또는 2023~24년 완료로 기록돼 있었으나 검증된 제4공장 준공은 2024-10이며, 투자 발표일과 준공일을 혼동하지 않는다. 완전 가동 여부는 별도로 검증되지 않았다. (4) 차기 발표가 '11월 예정'으로만 있었으나 2026-11-10 16:00으로 확정됐다. (5) '영업이익률 상승은 HBM 믹스 고도화를 뒷받침한다'는 메모는 HBM 분해 수치가 없고 매출총이익률이 하락했으므로 유지하지 않는다. (6) FY2026 설비투자·연구개발·감가상각 계획(7,000·2,200·1,800)은 이전 저장값에 없던 항목이다. (7) 일부 과거 분기 세그먼트 수치는 누적 차감 기준이어서 직접 분기표와 1백만엔 차이가 있으며, 본 프리뷰는 두 기준을 강제로 맞추지 않는다.","[검증 범위] 공식 원문에서 전분기 FY3/26 Q4 매출 8,691, 전년동기 FY3/26 Q2 매출 6,885를 직접 확인했다. 전년동기 Q2 영업이익 1,182는 공식 누적 차분이며 직접 분기값과 구분했다. HBM 매출·이익 비중, 수주·수주잔고 수치, Q1 영업현금흐름과 실제 설비투자 현금 지출, 아마가사키 실제 착공일과 신규 생산능력, 지진 영향 금액·완전 복구일, 2026-10-18 기준 검증된 컨센서스는 확인되지 않았다. 재고·지역별 합계, 매출원가, 현금·채권·유형자산 증감, 설비투자 누계에는 백만엔 미만 절사 차이가 있어 직접 공시값과 표시값 차이를 함께 남긴다. PDF 페이지는 물리적 페이지 기준이며 IR 일정 페이지의 게시일은 미확인, 관찰 기준일은 2026-10-18이다."],"source_ids":["JEM_GUIDE","JEM_Q1_RESULTS","JEM_Q1_SUP","JEM_MIDTERM","JEM_FY25_DECK","JEM_CALENDAR","PCARD_C01_SNAPSHOT"],"table":{"columns":["항목","이전 표시값 / 대안 기준","본 프리뷰 채택값","차이 성격"],"rows":[["2026-Q3 파생 매출","9,760백만엔","9,759백만엔 (19,400 − 9,641)","계산 차이 1백만엔"],["신공장 명칭·재원","본사 제2공장(가칭); 자기자금·차입","아마가사키 공장; 공모증자 약 12,200 전액","2026-05-14 공식 갱신"],["구마모토 증설 시점","2024-11 / 2023~24 완료","제4공장 준공 2024-10","발표일·준공일 혼동; 완전 가동 미검증"],["차기 결산 발표","11월 예정","2026-11-10 16:00 JST, 설명회 11-13","일정 확정"],["HBM 믹스 해석","영업이익률 상승 = HBM 고도화",null,"분해 수치 없음, 매출총이익률은 하락"],["FY2026 설비투자 / 연구개발 / 감가상각 계획","없음","7,000 / 2,200 / 1,800","신규 반영"],["재고 구성 합 vs 보고 총액","4,576 / 5,035 (구성 합)","4,577 / 5,036 (보고 총액)","절사, 각 1백만엔"],["매출채권 증가액","2,623 (회사 공표)","2,624 (표시값 차이)","절사, 1백만엔"],["설비투자 3개년 누계","14,881 (연도 합)","14,882 (회사 공표)","절사, 1백만엔"],["전년동기 Q1 매출원가","2,640 (매출−총이익)","2,639 (공식 손익계산서)","절사 차이 1; 직접 공시값 사용"],["현금 및 예금 감소액","2,066 (회사 공표)","2,067 (표시값 차이)","절사 차이 1"],["유형자산 순액 증가","71 (회사 공표)","72 (표시값 차이)","절사 차이 1"],["지역 매출 합 vs 연결","9,640 (지역 합)","9,641 (연결)","절사, 1백만엔"],["컨센서스","없음",null,"2026-10-18 당시 미확인; 10월 21일 단일 애널리스트 관측은 별도 수록, 판정용 컨센서스는 보류"]]},"chart":null},{"id":"s11_consensus_audit","title":"시장 추정 관측 감사: MarketScreener 단일 애널리스트 분기 추정과 IFIS 누적·연간 컨센서스 (2026-10-21 관측)","body":["[관측] 2026-10-21 00:20(KST, 2026-10-20 15:20:15 UTC)에 브라우저로 렌더링된 MarketScreener 분기 손익 추정 패널(회계기간 표기 'Fiscal Period: March')을 표시 화면 DOM 기준으로 캡처했다. 이 캡처는 서버 원본 응답이 아니라 표시된 화면의 증거다. 패널의 '2027 Q2' 열은 2027년 3월기 제2사분기, 즉 역년 2026-Q3(2026-07-01~09-30)이며, Net sales 9,759, EBIT 2,606, Earnings before Tax(EBT) 2,508, Net income 1,731백만엔이 추정 서식으로 표시되고 네 셀 모두 '추정을 제공한 애널리스트 수: 1'이라는 설명이 붙어 있다. 같은 패널의 '2027 Q3'·'2027 Q4' 열은 각각 10,000·2,400·2,400·1,650과 10,600·2,500·2,500·1,750백만엔(각 애널리스트 1명)의 표시값이다. 추정 수정일은 표시되지 않았고 '2027 Q2' 열의 발표일 칸은 '-'이며, 이 추정 표의 상위 데이터 제공자는 화면에서 식별되지 않았다. 관측 시각은 알지만 추정치 자체의 작성 시점은 알 수 없다.","[산술] 표시 매출 9,759백만엔은 회사 상반기 매출 가이드 19,400에서 Q1 실적 9,641을 뺀 기준점 9,759와 같다. 차이율은 (표시값 − 회사 기준점) ÷ 회사 기준점 × 100 = 0.0%다. 이 수치 일치만으로 추정 작성 방식이나 출처 동일성을 확인할 수 없다. 제공자의 EBIT 2,606·EBT 2,508·Net income 1,731은 원래 항목명으로 보존한다. 회사 영업이익·경상이익·순이익과의 정의 일치가 확인되지 않아 이익의 차이율과 합산 누적 환산은 사용하지 않는다. 제공자의 과거 매출 5,270·3,864·5,453·9,091·8,353은 보관한 회사 누적 차감값과 일치하고 분기 차트 라벨 5,269·3,863·5,452·9,090·8,352와는 1백만엔씩 다르다. 일치 사실은 확인했지만 제공자의 계산 방식은 공개 근거가 없어 단정하지 않는다.","[관측] IFIS(kabuyoho.jp) 표시 기준 2027년 3월기 연간 컨센서스는 매출 40,000·영업이익 10,600·경상이익 10,600·순이익 7,300백만엔(경상이익 표의 표시 날짜 2026/10/20, 애널리스트 수 미표시)으로 회사 연간 가이드 36,400·9,450·9,300·6,700 대비 +3,600(+9.9%)·+1,150(+12.2%)·+1,300(+14.0%)·+600(+9.0%)이다. 같은 제공자의 진척률 표는 경상이익 누적 컨센서스를 1Q 1,820·중간 5,700·3Q 8,100·통기 10,600으로 표시하고 회사 예상은 중간 5,300·통기 9,300, 1Q 실적은 3,192이다. 누적 컨센서스에서 실적을 뺀 값을 분기 컨센서스로 쓰지 않으며 추정 시점도 표시되지 않는다. [해석] 이상은 2026-10-21 기준의 출처 비교 관측이다. 단일 애널리스트, 수정일 미상, 상위 제공자 미상이고 다른 사이트(Futu는 스크립트 껍데기, minkabu는 404)에서 독립 관측을 얻지 못했으므로 scenario.consensus는 null을 유지하고 상회·하회 판정 기준으로 쓰지 않는다. 같은 값을 표시하는 다른 사이트가 있더라도 같은 상위 제공자를 쓸 수 있어 독립 검증으로 세지 않는다. 10절의 2026-10-18 기준 서술은 그 날짜의 기록으로 유지한다."],"source_ids":["JEM_MS_Q_DOM","JEM_IFIS_ANNUAL","JEM_IFIS_PROGRESS","JEM_GUIDE","JEM_Q1_RESULTS","JEM_Q1_SUP"],"table":{"columns":["항목","회사 기준값(JPY백만)","제공자 표시값(JPY백만)","차이(JPY백만)","차이(%)","표시 애널리스트 수","비고"],"rows":[["2026-Q3 (FY3/27 Q2) 매출",9759,9759,0,0.0,1,"MarketScreener 'Net sales'; 기준값 = 상반기 가이드 19,400 − Q1 9,641; 수치 일치는 출처 동일성의 증거가 아님"],["2026-Q3 영업이익 vs 제공자 EBIT",2306,2606,"비교 보류","비교 보류",1,"EBIT는 제공자 정의; 회사 영업이익과 동일 정의 미확인; 회사 지표와 추정 항목의 정의 일치 확인 전 차이율 미산출"],["2026-Q3 경상이익 vs 제공자 EBT",2108,2508,"비교 보류","비교 보류",1,"EBT는 제공자 정의; 경상이익으로 재명명하지 않음; 회사 지표와 추정 항목의 정의 일치 확인 전 차이율 미산출"],["2026-Q3 순이익",1431,1731,"비교 보류","비교 보류",1,"기준값
